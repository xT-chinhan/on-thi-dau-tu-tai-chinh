<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nghe bài giảng</title>
<style>:root{--bg:#f6f7fb;--fg:#1b1f2a;--card:#fff;--ac:#0f766e;--hl:#fde68a}@media(prefers-color-scheme:dark){:root{--bg:#12141a;--fg:#e8eaf0;--card:#1c2029;--ac:#5eead4;--hl:#854d0e}}
body{margin:0;background:var(--bg);color:var(--fg);font:17px/1.6 system-ui,sans-serif}main{max-width:none;width:100%;box-sizing:border-box;padding:16px clamp(12px,3vw,48px)}a{color:var(--ac)}
section{width:100%;box-sizing:border-box;background:var(--card);border-radius:14px;padding:14px 16px;margin:14px 0}audio{width:100%}.tr{position:relative;height:62vh;overflow:auto;margin-top:8px}
.tr p{margin:4px 0;padding:6px 10px;font-size:1.08em;border-radius:8px;cursor:pointer}.tr p.on{background:var(--hl)}@media(max-width:560px){body{font-size:16px}h1{font-size:1.35rem}section{padding:10px 10px;margin:10px 0}.tr{height:56vh}.tr p{font-size:1.02em}.sp{display:flex;gap:6px;margin:6px 0}}.sp button{flex:1;min-height:40px;border:1px solid var(--ac);background:transparent;color:var(--fg);border-radius:10px;font:600 15px system-ui}.sp button.on{background:var(--ac);color:var(--bg)}</style></head><body><main>
<p><a href="index.html">← Trang ôn tập</a></p><h1>🎧 Nghe bài giảng (giọng VieNeu)</h1><p>Bấm vào một câu trong phụ đề để nhảy tới câu đó.</p><section><h2>Chương 1 · Overview of Investments</h2><div class="sp"><button>0.75×</button><button class="on">1×</button><button>1.25×</button></div><audio controls preload="none" src="audio/p1_chuong1.mp3" data-k="p1_chuong1"></audio><div class="tr" id="tr-p1_chuong1"></div></section><section><h2>Chương 2 · Equities Investment</h2><div class="sp"><button>0.75×</button><button class="on">1×</button><button>1.25×</button></div><audio controls preload="none" src="audio/p2_chuong2.mp3" data-k="p2_chuong2"></audio><div class="tr" id="tr-p2_chuong2"></div></section><section><h2>Chương 3 · Bond Investment</h2><div class="sp"><button>0.75×</button><button class="on">1×</button><button>1.25×</button></div><audio controls preload="none" src="audio/p3_chuong3.mp3" data-k="p3_chuong3"></audio><div class="tr" id="tr-p3_chuong3"></div></section><section><h2>Chương 4–5 · Derivatives, Alternatives, TA</h2><div class="sp"><button>0.75×</button><button class="on">1×</button><button>1.25×</button></div><audio controls preload="none" src="audio/p4_chuong4_5.mp3" data-k="p4_chuong4_5"></audio><div class="tr" id="tr-p4_chuong4_5"></div></section></main>
<script>document.querySelectorAll('.sp').forEach(sp=>{const a=sp.nextElementSibling;sp.querySelectorAll('button').forEach(b=>b.onclick=()=>{a.playbackRate=parseFloat(b.textContent);sp.querySelectorAll('button').forEach(x=>x.classList.remove('on'));b.classList.add('on')})});document.querySelectorAll("audio").forEach(async a=>{const k=a.dataset.k,box=document.getElementById("tr-"+k);
const segs=await (await fetch("audio/"+k+".json")).json();const ps=segs.map(s=>{const p=document.createElement("p");p.textContent=s.text;p.onclick=()=>{a.currentTime=s.start;a.play()};box.appendChild(p);return p});let cur=-1;
a.ontimeupdate=()=>{const i=segs.findIndex(s=>a.currentTime>=s.start&&a.currentTime<s.end+.25);if(i>=0&&i!==cur){if(cur>=0)ps[cur].classList.remove("on");ps[i].classList.add("on");cur=i;box.scrollTop=ps[i].offsetTop-box.clientHeight/2+ps[i].offsetHeight/2}}});</script></body></html>
