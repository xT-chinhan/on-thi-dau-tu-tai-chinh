const KMAP=new Map();KW.forEach(k=>{const key=k[2]?k[0]:k[0].toLowerCase();if(!KMAP.has(key))KMAP.set(key,k)});
const esc=s=>s.replace(/[.*+?^${}()|[\]\\\/]/g,"\\$&");
const KRE=new RegExp("(^|[^A-Za-z0-9_])("+[...KW].sort((a,b)=>b[0].length-a[0].length).map(k=>esc(k[0])).join("|")+")(?![A-Za-z0-9_])","gi");
function hl(html,found){let inCode=0;
 return html.split(/(<[^>]+>)/).map(seg=>{
  if(seg[0]=="<"){if(/^<code/i.test(seg))inCode=1;else if(/^<\/code/i.test(seg))inCode=0;if(/^<mark/i.test(seg))inCode=2;if(/^<\/mark/i.test(seg))inCode=0;return seg}
  if(inCode)return seg;
  return seg.replace(KRE,(m,p,k)=>{let e=KMAP.get(k.toLowerCase())||KMAP.get(k);
   if(!e||(e[2]&&e[0]!==k))return m;if(found)found.set(e[0],e[1]);
   return p+`<mark class="k${e[1]}">${k}</mark>`})}).join("")}
const md=s=>s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/\*\*(.+?)\*\*/g,"<b>$1</b>");
const H=(s,f)=>hl(md(s),f);
const store={get(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
Q.forEach((q,i)=>q.id=i);
let tab="ch1",sub="nho",qs={mode:"drill"};
const tabs=[["ch1","Ch.1"],["ch2","Ch.2"],["ch3","Ch.3"],["ch4","Ch.4"],["ch5","Ch.5"],["dang","Dạng bài"],["quiz","Quiz"]];
function nav(){$("#nav").innerHTML=tabs.map(t=>`<button style="--cc:var(--c${CCOL[t[0]]||(t[0]=="quiz"?5:2)})" class="${t[0]==tab?"on":""}" data-t="${t[0]}">${t[1]}</button>`).join("");
 $("#nav").querySelectorAll("button").forEach(b=>b.onclick=()=>{tab=b.dataset.t;render();scrollTo(0,0)})}
function legend(){return `<div class="legend"><mark class="k1">Strategy / People</mark><mark class="k2">Valuation</mark><mark class="k3">Bonds</mark><mark class="k4">Derivatives / Funds</mark><mark class="k5">Warning word</mark><mark class="k6">Cycle / TA</mark></div>`}
function render(){nav();const m=$("#m");m.style.setProperty("--cc",`var(--c${CCOL[tab]||(tab=="quiz"?5:2)})`);
 if(tab[0]=="c"){const n=tab.slice(2);
  m.innerHTML=`<div class="sub"><button data-s="nho" class="${sub=="nho"?"on":""}">🧠 Cần nhớ (thẻ lật)</button><button data-s="ct" class="${sub=="ct"?"on":""}">∑ Công thức</button>${sub=="nho"?`<button id="flipall">↻ Lật tất cả</button>`:""}</div><h2>${CH[n]}</h2>${legend()}`+hl(NOTES[n][sub]);
  m.querySelectorAll("[data-s]").forEach(b=>b.onclick=()=>{sub=b.dataset.s;render()});
  const fa=$("#flipall");if(fa)fa.onclick=()=>{const all=[...m.querySelectorAll(".flip")];const open=all.some(x=>!x.classList.contains("open"));all.forEach(x=>x.classList.toggle("open",open))};
  m.querySelectorAll(".flip").forEach(f=>{f.onclick=()=>f.classList.toggle("open");f.onkeydown=e=>{if(e.key=="Enter"||e.key==" "){e.preventDefault();f.classList.toggle("open")}}})}
 else if(tab=="dang"){m.innerHTML=`<h2>Dạng bài &amp; cách giải</h2>${legend()}<div class="tip">Mọi số đã được kiểm chứng bằng Python. Nếu slide làm tròn khác (vd 49.098 vs 49.099) → chọn đáp án gần nhất.</div>`+hl(DANG)}
 else quiz(m)}
function quiz(m){
 const wrong=store.get("wrong",[]);
 m.innerHTML=`<h2>Quiz (English)</h2>${legend()}<div class="bar"><button data-m="drill" class="${qs.mode=="drill"?"on":""}">Luyện từng câu</button><button data-m="exam40" class="${qs.mode=="exam40"?"on":""}">Đề 40 câu · 40 phút</button><button data-m="exam120" class="${qs.mode=="exam120"?"on":""}">Đề 120 câu · 120 phút</button><button data-m="wrong" class="${qs.mode=="wrong"?"on":""}">Ôn câu sai (${wrong.length})</button></div><div id="qa"></div>`;
 m.querySelectorAll("[data-m]").forEach(b=>b.onclick=()=>{qs={mode:b.dataset.m};quiz(m)});
 if(qs.mode=="drill")setup(false);else if(qs.mode=="wrong")setup(true);else exam(qs.mode=="exam120"?120:40);
}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a}
let posBag=[];
function nextPos(){if(!posBag.length)posBag=shuffle([0,1,2,3]);return posBag.pop()}
function numOf(s){const m=String(s).replace(/,/g,"").match(/-?\d+(\.\d+)?/);return m?parseFloat(m[0]):NaN}
const LAST=/^(all|none) of the (above|options)/i;
function ordOf(q){const o=q.o,idx=[0,1,2,3];
 if(o.every(s=>/^[^\d\n]{0,4}-?\d/.test(s))){const v=i=>numOf(o[i]);return idx.sort((a,b)=>v(a)-v(b))}
 const tail=idx.filter(i=>LAST.test(o[i])),rest=idx.filter(i=>!tail.includes(i));
 if(tail.length)return shuffle(rest).concat(tail);
 const p=nextPos(),others=shuffle([1,2,3]),r=[];let j=0;for(let k=0;k<4;k++)r.push(k==p?0:others[j++]);return r}
function setup(w){const tags=[...new Set(Q.map(q=>q.tag))];
 $("#qa").innerHTML=`<div class="bar">Chapter <select id="fc"><option value="">All</option>${[1,2,3,4,5].map(i=>`<option value="${i}">${CH[i]}</option>`).join("")}</select> Type <select id="ft"><option value="">All</option>${tags.map(t=>`<option>${t}</option>`).join("")}</select> <label><input type="checkbox" id="sh" checked> Shuffle</label> <button id="go" class="on">Bắt đầu ▶</button></div><div id="qq"></div>`;
 $("#go").onclick=()=>{let l=Q.filter(q=>(!$("#fc").value||q.ch==$("#fc").value)&&(!$("#ft").value||q.tag==$("#ft").value));
  if(w){const ws=store.get("wrong",[]);l=l.filter(q=>ws.includes(q.id))}
  if($("#sh").checked)l=shuffle(l);
  if(!l.length){$("#qq").innerHTML="<p>Không có câu nào.</p>";return}
  l.length>20?paged(l,{instant:true,label:"Practice"}):drill(l,0,0)}}
function head(q,i,n){return `<div class="mut"><span class="chp" style="--cc:var(--c${q.ch})">${CH[q.ch]}</span><span class="tag">${q.tag}</span> · Question ${i+1}/${n}</div>`}
function qHTML(q,i,n,locked,pick,order){
 return `<div class="qb" style="--cc:var(--c${q.ch})">${head(q,i,n)}<div class="qt">${H(q.q)}</div>`+
 order.map((oi,k)=>{let c="opt";if(locked){if(oi==0)c+=" ok";else if(pick==oi)c+=" no"}else if(pick==oi)c+=" sel";
  return `<button class="${c}" data-o="${oi}"><i>${"ABCD"[k]}</i><span>${H(q.o[oi])}</span></button>`}).join("")+`</div>`}
function fbox(q,ok,order){const f=new Map();
 const ex=H(q.e,f),tip=H(q.t,f);md(q.q);H(q.q,f);H(q.o[0],f);
 const chips=[...f].map(([k,g])=>`<mark class="k${g}">${k}</mark>`).join("");
 return `<div class="fb"><div class="res" style="color:${ok?"var(--ok)":"var(--bad)"}">${ok?"✅ Correct":"❌ Wrong"} — answer: ${"ABCD"[order.indexOf(0)]}</div><div>${ex}</div>`+
 (chips?`<div class="box"><h5>🔑 Keyword</h5><div class="chips">${chips}</div></div>`:"")+`<div class="box"><h5>💡 Mẹo</h5>${tip}</div></div>`}
function drill(l,i,score){const q=l[i],order=ordOf(q);let locked=false;
 const draw=(pick)=>{$("#qq").innerHTML=`<div class="bar"><div class="prog"><div style="width:${(i+(locked?1:0))/l.length*100}%"></div></div><span class="mut"><b>${score}</b>/${i+(locked?1:0)} correct</span></div>`+qHTML(q,i,l.length,locked,pick,order)+(locked?fbox(q,pick==0,order)+`<div class="bar"><button id="nx" class="on">${i+1<l.length?"Next question →":"See result"}</button></div>`:"");
  if(!locked)$("#qq").querySelectorAll(".opt").forEach(b=>b.onclick=()=>{locked=true;const p=+b.dataset.o;if(p==0)score++;rec(q.id,p==0);draw(p);$("#qq").querySelector(".fb").scrollIntoView({block:"nearest",behavior:"smooth"})});
  else $("#nx").onclick=()=>{i+1<l.length?(drill(l,i+1,score),scrollTo(0,0)):$("#qq").innerHTML=`<div class="qb"><div class="big">${score}/${l.length}</div><p>Câu sai được lưu ở “Ôn câu sai”.</p></div>`}};
 draw(null)}
function rec(id,ok){let w=store.get("wrong",[]);w=ok?w.filter(x=>x!=id):[...new Set([...w,id])];store.set("wrong",w)}
function exam(N){const quota=N==120?{1:18,2:36,3:36,4:24,5:6}:{1:6,2:12,3:12,4:8,5:2};let l=[];
 for(const c in quota)l=l.concat(shuffle(Q.filter(q=>q.ch==c)).slice(0,quota[c]));
 paged(shuffle(l),{minutes:N==120?120:40,label:N+"-question exam"})}
const PS=10;
function paged(l,opt){const N=l.length,np=Math.ceil(N/PS),ans={},ord=l.map(q=>ordOf(q)),inst=!!opt.instant;
 let pg=0,done=false,tm,end=opt.minutes?Date.now()+opt.minutes*60000:0,sc=0;
 const locked=k=>done||(inst&&ans[k]!==undefined);
 const pager=id=>{let h=`<div class="bar pgr"><button data-g="prev"${pg==0?" disabled":""}>← Prev</button><span class="mut">Page <b>${pg+1}</b>/${np}</span><button data-g="next"${pg==np-1?" disabled":""}>Next →</button><label class="mut">Go to <input type="number" min="1" max="${np}" value="${pg+1}" class="jmp" data-j></label></div>`;
  if(id=="t")h+=`<div class="bar">${Array.from({length:np},(_,p)=>{let c=0;for(let k=p*PS;k<Math.min(N,p*PS+PS);k++)if(ans[k]!==undefined)c++;const full=c==Math.min(PS,N-p*PS);return `<button data-p="${p}" class="num ${p==pg?"on":""} ${full&&p!=pg?"done":""}">${p+1}</button>`}).join("")}</div>`;
  return h};
 const draw=(keep)=>{const y=scrollY,na=Object.keys(ans).length;let h="";
  if(done)h+=`<div class="qb"><div class="big">${sc}/${N} (${(sc/N*10).toFixed(2)}/10)</div><p>${opt.label}: review below. Wrong answers are saved in “Ôn câu sai”.</p></div>`;
  else h+=`<div class="bar stick">${opt.minutes?`<span class="big" id="clk"></span>`:""}<div class="prog"><div style="width:${na/N*100}%"></div></div><span class="mut"><b>${na}</b>/${N} answered</span><button id="sub" class="on">${opt.minutes?"Nộp bài":"Kết thúc"}</button></div>`;
  h+=pager("t");
  for(let k=pg*PS;k<Math.min(N,pg*PS+PS);k++){const q=l[k],lk=locked(k);h+=qHTML(q,k,N,lk,ans[k],ord[k])+(lk?fbox(q,ans[k]===0,ord[k]):"")}
  h+=pager("b");$("#qa").innerHTML=h;
  $("#qa").querySelectorAll(".qb").forEach((bx,i)=>{const k=pg*PS+i;bx.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{if(locked(k))return;ans[k]=+b.dataset.o;if(inst)rec(l[k].id,ans[k]===0);draw(1)})});
  $("#qa").querySelectorAll("[data-g]").forEach(b=>b.onclick=()=>{pg=Math.max(0,Math.min(np-1,pg+(b.dataset.g=="next"?1:-1)));draw();scrollTo(0,0)});
  $("#qa").querySelectorAll("[data-p]").forEach(b=>b.onclick=()=>{pg=+b.dataset.p;draw();scrollTo(0,0)});
  $("#qa").querySelectorAll("[data-j]").forEach(e=>e.onchange=()=>{pg=Math.max(0,Math.min(np-1,(+e.value||1)-1));draw();scrollTo(0,0)});
  const sb=$("#sub");if(sb)sb.onclick=()=>{const un=N-Object.keys(ans).length;if(!un||confirm(`${un} unanswered. Submit anyway?`))finish()};
  if(keep)scrollTo(0,y);tick()};
 const tick=()=>{clearInterval(tm);if(!opt.minutes||done)return;const f=()=>{const s=Math.max(0,(end-Date.now())/1000|0),e=$("#clk");if(e)e.textContent=`⏱ ${String(s/60|0).padStart(2,"0")}:${String(s%60).padStart(2,"0")}`;if(s<=0&&!done){clearInterval(tm);finish()}if(!e)clearInterval(tm)};f();tm=setInterval(f,1000)};
 const finish=()=>{if(done)return;done=true;clearInterval(tm);sc=0;l.forEach((q,k)=>{const ok=ans[k]===0;if(ok)sc++;if(!inst)rec(q.id,ok)});pg=0;draw();scrollTo(0,0)};
 draw()}

$("#th").onclick=()=>{const r=document.documentElement;const d=r.dataset.t=="dark"||(!r.dataset.t&&matchMedia("(prefers-color-scheme:dark)").matches);setTheme(!d)};
