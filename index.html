<title>Ôn tập Đầu tư tài chính – HUB</title>
<style>
:root{--bg:#f3f5fa;--fg:#111827;--card:#ffffff;--card2:#eef2ff;--mut:#4b5563;--bd:#cfd6e6;--ac:#2446b8;--ok:#0f7a3d;--bad:#b42323;--tip:#fff4c2;
--c1:#2563eb;--c2:#0f9d58;--c3:#e8710a;--c4:#8e44ad;--c5:#0e8f94;
--m1:#bfdbfe;--m2:#bbf7d0;--m3:#fed7aa;--m4:#e9d5ff;--m5:#fecaca;--m6:#a5f3fc;--sh:0 1px 3px rgba(20,30,60,.12)}
@media(prefers-color-scheme:dark){:root:not([data-t=light]){--bg:#0b0f17;--fg:#f3f4f6;--card:#151b28;--card2:#1c2540;--mut:#aab3c5;--bd:#334060;--ac:#8fb0ff;--ok:#5fe39a;--bad:#ff8a8a;--tip:#4a3f12;
--c1:#6ea0ff;--c2:#4cd68a;--c3:#ffa24d;--c4:#c58cf0;--c5:#4fd6db;--m1:#1e4a99;--m2:#17683b;--m3:#8a4a0a;--m4:#5c2b82;--m5:#8c2a2a;--m6:#12666b;--sh:none}}
:root[data-t=dark]{--bg:#0b0f17;--fg:#f3f4f6;--card:#151b28;--card2:#1c2540;--mut:#aab3c5;--bd:#334060;--ac:#8fb0ff;--ok:#5fe39a;--bad:#ff8a8a;--tip:#4a3f12;
--c1:#6ea0ff;--c2:#4cd68a;--c3:#ffa24d;--c4:#c58cf0;--c5:#4fd6db;--m1:#1e4a99;--m2:#17683b;--m3:#8a4a0a;--m4:#5c2b82;--m5:#8c2a2a;--m6:#12666b;--sh:none}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:17px/1.65 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{position:sticky;top:0;z-index:10;background:var(--card);border-bottom:2px solid var(--bd);padding:8px 16px 0;box-shadow:var(--sh)}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;max-width:none;margin:0;padding:0 clamp(12px,3vw,48px)}
h1{font-size:18px;margin:0;font-weight:800}
nav{display:flex;gap:6px;overflow-x:auto;padding:8px clamp(12px,3vw,48px) 10px;max-width:none;margin:0;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{flex:0 0 auto;font-weight:700}
button{font:inherit;font-size:16px;border:2px solid var(--bd);background:var(--card);color:var(--fg);border-radius:12px;padding:8px 14px;min-height:44px;cursor:pointer}
button.on{background:var(--cc,var(--ac));border-color:var(--cc,var(--ac));color:#fff}
body[data-dark] button.on{color:#07101f}

main{max-width:none;margin:0;padding:14px clamp(12px,3vw,48px) 80px}
h2{font-size:24px;margin:14px 0 8px;border-left:8px solid var(--cc,var(--ac));padding-left:10px}
.sub{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.tip{background:var(--tip);border-radius:12px;padding:10px 14px;margin:12px 0;border:1px solid var(--bd)}
.fcs{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));margin-top:10px}
.flip{perspective:900px;cursor:pointer;outline:none}
.flip:focus-visible .front{outline:3px solid var(--ac)}
.ff{display:grid;transform-style:preserve-3d;transition:transform .45s}
.flip.open .ff{transform:rotateY(180deg)}
.front,.back{grid-area:1/1;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:14px;padding:14px 16px;border:2px solid var(--bd);box-shadow:var(--sh);min-height:110px}
.front{background:var(--card);border-top:7px solid var(--cc,var(--ac));display:flex;flex-direction:column;justify-content:center}
.front b{font-size:20px;line-height:1.35}
.hint{font-size:12px;color:var(--mut);margin-bottom:4px}
.back{background:var(--card2);transform:rotateY(180deg);font-size:16px}
.mt{margin:8px 0 0;color:var(--mut);border-top:1px dashed var(--bd);padding-top:6px}
.fl{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
.fc,.card,.qb{background:var(--card);border:2px solid var(--bd);border-radius:14px;padding:14px 16px;box-shadow:var(--sh)}
.fc{border-left:7px solid var(--cc,var(--ac))}
.fc h4,.card h3{margin:0 0 8px;font-size:19px}
code{display:block;background:var(--card2);padding:8px 10px;border-radius:8px;font:15px/1.6 ui-monospace,Menlo,Consolas,monospace;white-space:pre-wrap;word-break:break-word}
.fc p{margin:8px 0 0;color:var(--mut);font-size:15px}
.card{margin-bottom:12px}.card ol{padding-left:22px}.ex{background:var(--card2);border-radius:10px;padding:10px 12px;margin-top:8px}
mark{border-radius:5px;padding:0 4px;color:inherit;font-weight:700;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.k1{background:var(--m1)}.k2{background:var(--m2)}.k3{background:var(--m3)}.k4{background:var(--m4)}.k5{background:var(--m5)}.k6{background:var(--m6)}
.qb{border-left:8px solid var(--cc,var(--ac));margin-top:10px}
.qt{font-size:20px;font-weight:700;line-height:1.5;margin:8px 0 12px}
.opt{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;margin:8px 0;padding:12px 14px;min-height:56px;font-size:17px;line-height:1.45;border-width:2px}
.opt i{font-style:normal;font-weight:800;min-width:26px;height:26px;border-radius:50%;background:var(--card2);display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto;font-size:15px}
.opt.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 22%,var(--card))}
.opt.no{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 22%,var(--card))}
.opt.sel{border-color:var(--ac);background:var(--card2)}
.tag{display:inline-block;font-size:13px;font-weight:700;background:var(--card2);border:1px solid var(--bd);border-radius:20px;padding:1px 10px;margin-left:4px;color:var(--mut)}
.chp{display:inline-block;font-size:13px;font-weight:800;color:#fff;background:var(--cc);border-radius:20px;padding:1px 10px}
body[data-dark] .chp{color:#07101f}
.fb{margin-top:12px;padding:12px 14px;border-radius:12px;background:var(--card2);border:2px solid var(--bd)}
.fb .res{font-size:19px;font-weight:800;margin-bottom:6px}
.box{margin-top:10px;padding:10px 12px;border-radius:10px;background:var(--card);border:2px dashed var(--bd)}
.box h5{margin:0 0 6px;font-size:15px}
.chips mark{display:inline-block;margin:3px 4px 3px 0;padding:2px 9px}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:10px 0}
.pgr{justify-content:space-between}.jmp{width:64px;padding:8px;font-size:16px;border:2px solid var(--bd);border-radius:8px;background:var(--card);color:inherit}.stick{position:sticky;top:56px;z-index:5;background:var(--bg);padding:6px 0}button[disabled]{opacity:.4}
.prog{height:12px;border-radius:8px;background:var(--bd);overflow:hidden;flex:1 1 140px}
.prog>div{height:100%;background:var(--cc,var(--ac));transition:width .3s}
select{font:inherit;font-size:16px;padding:9px;border-radius:10px;border:2px solid var(--bd);background:var(--card);color:var(--fg);min-height:44px}
.big{font-size:26px;font-weight:800}.mut{color:var(--mut);font-size:15px}
.legend{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.num{padding:2px 0!important;min-height:36px!important;min-width:40px;font-size:14px!important}
.num.done{border-color:var(--ac);background:var(--card2)}
@media(max-width:560px){body{font-size:16px}.qt{font-size:19px}h1{font-size:16px}}
</style></head><body>

const Q=[{"ch": 1, "tag": "Definition", "q": "According to Bodie, Kane & Marcus, an **investment** is:", "o": ["Committing money or other resources now for expected future benefits", "Purchasing goods and services now purely for immediate personal consumption", "Depositing money at a zero interest rate in order to preserve the capital", "Short-term trading aimed at profiting from intraday price differences"], "e": "'The current commitment of money or other resources in the expectation of reaping future benefits' (Bodie, p.1).", "t": "Keyword: **current commitment** → **future benefits** (bỏ ra bây giờ – hưởng sau)."}, {"ch": 1, "tag": "Definition", "q": "Which elements does Graham & Dodd's definition of an \"investment operation\" (Security Analysis) emphasize?", "o": ["Thorough analysis, safety of principal and a satisfactory return", "The highest possible return in a short time, regardless of the risk", "Following the crowd (herd) to save on the cost of analysis", "Buying and selling quickly within a very short period of time"], "e": "Graham: một nghiệp vụ đầu tư là nghiệp vụ mà sau khi **phân tích kỹ** hứa hẹn **an toàn vốn gốc** và **lợi suất thỏa đáng**.", "t": "Nhớ '3 chữ': Thorough – Safety – Satisfactory."}, {"ch": 1, "tag": "True/False/NOT", "q": "Which of the following is NOT an \"interest bearing instrument\"?", "o": ["Common stock", "Money market instruments", "Fixed-income securities (bonds)", "Short-term Treasury bills"], "e": "Nhóm hưởng lãi: money market + bond. Cổ phiếu thuộc nhóm **Equities**.", "t": "3 nhóm: Interest bearing | Equities | Derivatives & others."}, {"ch": 1, "tag": "Definition", "q": "In the 8-step investment process, what is the FIRST step?", "o": ["Determine investment objectives: profits and risks", "Analysis of the identified investment opportunities and instruments", "Disbursement of capital into the chosen investment", "Market timing: choosing when to enter the market"], "e": "Thứ tự: Objectives → Asset allocation → Law → Find opportunities → Analyze → Market timing → Disbursement → Track (take profit/cut loss).", "t": "Mẹo câu: **Mục – Phân – Luật – Tìm – Phân tích – Thời điểm – Giải ngân – Theo dõi**."}, {"ch": 1, "tag": "True/False/NOT", "q": "In the investment process, which step comes IMMEDIATELY AFTER \"Asset allocation\"?", "o": ["Seeking information about the law on investment", "Market timing: choosing the best moment to enter", "Analysis of the identified investment opportunities", "Disbursement of funds into the chosen assets"], "e": "Asset allocation (2) → Law (3) → Looking for opportunities (4).", "t": "Hỏi thứ tự → đếm số: 1 mục tiêu, 2 phân bổ, 3 luật."}, {"ch": 1, "tag": "Trap", "q": "According to CNBC, what is the correct advice about the mistake \"Fear to cut losses\"?", "o": ["Never be patient with losses; the market is always right", "Hold the losing stock because it has fallen too far to fall any more", "Keep averaging down until you break even again and recover", "Wait for a celebrity's advice before deciding to sell the stock"], "e": "Slide: 'never be patient with losses'; 'the market is always right'.", "t": "Lãi thì **kiên nhẫn**, lỗ thì **cắt**. Đừng nghĩ 'giảm sâu rồi không giảm nữa'."}, {"ch": 1, "tag": "Trap", "q": "How does CNBC advise investors to avoid the mistake \"Realizing profits too early\"?", "o": ["Be patient with profitable investments because big waves can last for years", "Take profits as soon as a small gain appears, to lock in the return", "Sell everything when the price rises sharply because it cannot go up any more", "Switch to another field of investment as soon as a gain appears"], "e": "Nhà đầu tư mới hay chốt lời quá sớm và bỏ lỡ big wave.", "t": "6 sai lầm: **Sớm – Sợ – Bầy – Sao – Giờ – Sở trường** (chốt sớm, sợ cắt lỗ, herd, nghe người nổi tiếng, quản lý thời gian kém, quên sở trường)."}, {"ch": 1, "tag": "Definition", "q": "What is the \"herd effect\" in investing?", "o": ["Believing a stock bought by many people must be of good quality", "Investing only in the one field in which you are an expert", "Analyzing financial statements carefully before buying any stock", "Managing time so as to find key information as quickly as possible"], "e": "Herd = hành vi bầy đàn, bị ảnh hưởng bởi người khác/biến động thị trường.", "t": "Herd = bầy đàn = **gamble** (cờ bạc)."}, {"ch": 1, "tag": "Compare", "q": "Which question does fundamental analysis answer, and which strategy does it suit?", "o": ["\"Why\" / good or bad stocks → long-term strategy", "\"How\" / will the stock rise or fall → a short-term strategy", "It uses only prices and volumes to find trends → short term", "It uses mathematical models to forecast prices → long term"], "e": "Fundamental: why, good/bad stock, long-term. Technical: how, price & volume, short-term. Quantitative: mô hình toán.", "t": "**F**undamental = **W**hy (dài hạn). **T**echnical = **H**ow, giá + khối lượng (ngắn hạn)."}, {"ch": 1, "tag": "Compare", "q": "Which data does technical analysis work with?", "o": ["Prices and volumes", "Macroeconomic and company information", "Mathematical models forecasting revenue and profit", "Only annual financial statements"], "e": "Technical: prices and volumes, trả lời 'How', cổ phiếu tăng hay giảm.", "t": "Technical = **price + volume**."}, {"ch": 1, "tag": "Definition", "q": "Value investing is a strategy that:", "o": ["Picks stocks priced below intrinsic or book value and holds them long term", "Picks stocks with the highest EPS growth regardless of the price paid for them", "Buys the 10 highest dividend-yielding stocks in the DJIA and rebalances every year", "Trades in the short term based on chart patterns and momentum signals"], "e": "Value investor tìm cổ phiếu bị thị trường định giá thấp (undervalued).", "t": "Value = **undervalued**, price < intrinsic value."}, {"ch": 1, "tag": "Definition", "q": "Which criterion is typically used in the GARP (Growth At a Reasonable Price) strategy?", "o": ["PEG < 1 (growth with a relatively low P/E)", "PEG > 2 (very high growth at any price)", "Only the highest-dividend stocks in the market", "The highest P/E ratio in the whole market"], "e": "GARP = kết hợp growth + value; dùng PEG<1. (Slide viết nhầm 'GRAP' – đúng là GARP).", "t": "GARP = **G**rowth + **A**ffordable → PEG<1. Bẫy: chính tả GRAP là typo."}, {"ch": 1, "tag": "Definition", "q": "What is the \"Dogs of the Dow\" (DOD) strategy?", "o": ["Holding the 10 highest-yielding DJIA stocks, rebalanced yearly", "Buying the 30 DJIA stocks with the highest P/E ratios and holding them for good", "Buying the 10 best-performing DJIA stocks of the year and rebalancing every day", "Buying the 10 DJIA stocks with the smallest market capitalization each quarter"], "e": "DOD dựa trên giả định blue-chip không thay đổi cổ tức theo chu kỳ; cổ tức cao/giá thấp → gần đáy chu kỳ.", "t": "Số: **10 trong 30**, rebalance **đầu năm**, tiêu chí **dividend yield**."}, {"ch": 1, "tag": "True/False/NOT", "q": "In CANSLIM, which meaning of the letter \"S\" (Supply and demand) is CORRECT?", "o": ["Scarce supply with strong demand", "Stability of earnings over many years", "Size of the firm measured by total assets", "Strong dividends paid every single quarter"], "e": "S: scarce SUPPLY + strong DEMAND; buyback (re-purchasing) giảm supply.", "t": "S = **S**upply (buyback = giảm cung)."}, {"ch": 1, "tag": "Definition", "q": "What does the letter \"C\" in CANSLIM require?", "o": ["Current quarterly EPS sharply above the same quarter last year (> 20%)", "Annual EPS growth sustained for 5 consecutive years, generally > 20%", "New products, new management or new events that push the stock to new highs", "The stock is a leader rather than a laggard in its industry group"], "e": "C = Current quarterly EPS (>20%). A = Annual EPS 3–5 năm (>20%).", "t": "CANSLIM: **C**urrent, **A**nnual, **N**ew, **S**upply, **L**eader, **I**nstitutional, **M**arket. Mẹo: 'Cảnh Anh Nay Sợ Lạnh Im Mồm'."}, {"ch": 1, "tag": "True/False/NOT", "q": "Which statement about the letter \"I\" (Institutional sponsorship) in CANSLIM is CORRECT?", "o": ["Pick stocks backed by a few institutions; avoid over-owned ones", "The more institutions that hold the stock, the better its prospects", "No institution at all should hold the stock under any circumstance", "I stands for Inflation, which must be low for the stock to rise"], "e": "Muốn vào trước khi 'big money' đầu tư đầy đủ.", "t": "Over-owned = đã hết dư địa tăng giá do tổ chức."}, {"ch": 1, "tag": "Definition", "q": "Who created CANSLIM, and which approaches does it combine?", "o": ["William O'Neil (IBD): fundamental and technical analysis", "Benjamin Graham: fundamental analysis only, with no use of price charts", "Philip Fisher: technical analysis only, with no use of earnings data", "Warren Buffett: quantitative analysis based on mathematical models"], "e": "CANSLIM là hệ thống chọn growth stock, bullish cho thị trường tăng nhanh.", "t": "O'Neil = CANSLIM; Graham = value; Fisher = chất lượng quản lý."}, {"ch": 1, "tag": "Calculation", "q": "Stock A trades at 60,000 VND and its EPS is 5,000 VND per year. What is A's P/E?", "o": ["12 times", "10 times", "8.33 times", "0.083 times"], "e": "P/E = P/EPS = 60,000/5,000 = 12.", "t": "P/E = **Giá ÷ EPS**. Đọc: mất 12 năm EPS để 'hoàn vốn'."}, {"ch": 2, "tag": "Compare", "q": "In which order does the Top-down model proceed?", "o": ["Economy → Industry → Firm", "Firm → Industry → Economy", "Industry → Firm → Economy", "Economy → Firm → Industry"], "e": "Top-down: từ vĩ mô xuống. Bottom-up: từ doanh nghiệp lên.", "t": "Top = trên cùng = Economy trước."}, {"ch": 2, "tag": "Compare", "q": "Which model suits individual investors who prioritize finding undervalued stocks?", "o": ["Bottom-up", "Top-down", "Neither model is suitable", "Technical analysis only"], "e": "Top-down: tổ chức; nếu kinh tế/ngành không ổn định thì không đầu tư. Bottom-up: cá nhân, tìm cổ phiếu undervalued.", "t": "Tổ chức = Top-down; Cá nhân = Bottom-up."}, {"ch": 2, "tag": "True/False/NOT", "q": "Which of the following is NOT a macro indicator in economic analysis?", "o": ["The P/E ratio of one particular company", "GDP growth and the inflation rate of the country", "The exchange rate and the interest rate levels", "The balance of payments (BOP) and the ICOR"], "e": "Macro: GDP, inflation, unemployment, exchange rate, interest rate, public debt, ICOR, FDI/FII/ODA, BOP… P/E công ty là cấp doanh nghiệp.", "t": "Từ khóa: 'KHÔNG phải macro' → chọn chỉ tiêu cấp công ty."}, {"ch": 2, "tag": "Definition", "q": "What is the investment environment?", "o": ["A mix of economic, social, legal, financial and infrastructure factors", "A mix of political, military, religious and diplomatic factors in the country", "The set of tax, accounting and auditing regulations that apply to a company", "A mix of stock prices, trading volumes and market indices on the exchange"], "e": "Ví dụ slide: từ 2020 ngân hàng nước ngoài được lập chi nhánh 100% vốn tại Trung Quốc.", "t": "Environment = economic + social + cultural + legal + financial + infrastructure."}, {"ch": 2, "tag": "Definition", "q": "In the business cycle, what typically happens in the EXPANSION phase?", "o": ["Low interest rates, easy borrowing and rising profits", "GDP falls, layoffs begin and investors shift money into bonds", "Growth hits its maximum and production costs start to rise sharply", "The economy hits its lowest point and then begins to recover again"], "e": "Expansion = boom: low interest rate, output ↑, profit ↑, stock ↑.", "t": "Expansion = **mở rộng** → mọi thứ ↑."}, {"ch": 2, "tag": "Definition", "q": "In the PEAK phase of the business cycle:", "o": ["Growth reaches its maximum and rising costs are passed on to customers", "Interest rates are at their lowest and firms start hiring more workers again", "Consumer spending falls sharply and a bear market in stocks begins", "The economy starts to recover from its lowest point and output rises"], "e": "Peak: growth at its fastest rate; chỉ số kinh tế ổn định rồi quay đầu đi xuống.", "t": "Peak = đỉnh → sắp quay đầu."}, {"ch": 2, "tag": "Definition", "q": "In the RECESSION phase, investors typically:", "o": ["Move money into safe assets like Treasury bonds and cash", "Buy stocks aggressively because interest rates are so high", "Hire more workers to meet the strong demand for goods", "Borrow more money to expand their production capacity"], "e": "Recession: chi tiêu giảm, GDP giảm, bear market, safe assets (Treasury bonds, cash).", "t": "Recession = **chạy sang an toàn** (safe haven)."}, {"ch": 2, "tag": "Trap", "q": "The slide calls the 4th phase \"Depression\", but what does its content actually describe?", "o": ["The economy reaches its lowest point and starts to recover", "The economy overheats and reaches its peak growth rate", "A prolonged crisis in which many firms close permanently", "The period in which interest rates reach their highest level"], "e": "Slide đặt tên 'Depression' nhưng nội dung là recovery: economy reaches lowest point, bottoms out, restarts the cycle; stocks rise.", "t": "Bẫy tên-vs-nội dung: pha 4 = **đáy → hồi phục**. (Great Depression được nhắc ở pha 3.)"}, {"ch": 2, "tag": "Definition", "q": "What are the two criteria for selecting an industry (Step 1 of industry analysis)?", "o": ["Industry growth relative to GDP growth, and fit with the current economic stage", "The industry's average P/E and P/B compared with the rest of the market", "The number of listed companies and the total market capitalization of the industry", "Government bond yields and exchange rates in the current period"], "e": "Step 1: select industry (growth vs GDP + fit with economic stage). Step 2: Porter model + dự báo.", "t": "Chọn ngành: **vượt GDP** + **hợp chu kỳ**."}, {"ch": 2, "tag": "Definition", "q": "Which organizations developed the GICS industry classification system?", "o": ["Morgan Stanley and Standard & Poor's", "The United Nations (UN) statistics division", "Dow Jones and FTSE (the ICB system)", "The U.S. Census Bureau (the NAICS system)"], "e": "ISIC (UN), NAICS (USA), UK SIC (UK), ICB (Dow Jones & FTSE), GICS (Morgan Stanley & S&P), VSIC 2007 (VN).", "t": "ISIC=UN, NAICS=USA, ICB=DJ+FTSE, GICS=MS+S&P, VSIC=Việt Nam."}, {"ch": 2, "tag": "Definition", "q": "A company's industry is determined by:", "o": ["Its main business activity, which brings the main revenue for a long time", "The industry that has the largest number of companies listed on the exchange", "The industry the board of directors chooses at the time of registration", "The industry in which the company has the largest charter capital"], "e": "Industry classification dựa trên main business = nguồn doanh thu chính lâu dài.", "t": "Main business = main revenue."}, {"ch": 2, "tag": "True/False/NOT", "q": "Which of the following is NOT one of Michael Porter's five competitive forces?", "o": ["Government policy", "Threat of new entrants", "Threat of substitute products", "Rivalry among existing competitors"], "e": "5 forces: new entrants, buyers' bargaining power, suppliers' bargaining power, substitutes, rivalry.", "t": "5 lực = **Mới vào – Khách ép – Nhà cung ép – Thay thế – Thù địch (cạnh tranh nội bộ)**."}, {"ch": 2, "tag": "Definition", "q": "The goal of industry analysis with Michael Porter's model is to:", "o": ["Find which factors drive industry competition and affect its profit", "Forecast tomorrow's exact stock price of every company in the industry", "Compute the industry's WACC from its average capital structure", "Assign the official VSIC industry code to each listed company"], "e": "Porter (sinh 1947, giáo sư Harvard Business School, chiến lược cạnh tranh).", "t": "Porter = Harvard, competitive strategy, 5 forces."}, {"ch": 2, "tag": "True/False/NOT", "q": "Which condition INCREASES the bargaining power of buyers?", "o": ["Buyers are concentrated, buy in bulk and can switch easily", "The product is highly differentiated and the switching costs are high", "There are only a few small buyers scattered across the market", "The product is vital to the buyer's own product and is monopolized"], "e": "Buyers mạnh khi: tập trung, mua nhiều, sản phẩm đồng nhất, switch cost thấp, am hiểu sản phẩm.", "t": "Switch cost **thấp** → người mua **mạnh**."}, {"ch": 2, "tag": "Definition", "q": "The five competitive advantages in the slide are:", "o": ["Trademark, License/patent, Fee, Convert fee, Price", "Capital, labor, land, technology and brand reputation", "Price, place, advertising, promotion and packaging", "Dividends, EPS, ROE, P/E and P/B ratios of the firm"], "e": "Trademark: sẵn sàng trả cao hơn; License: bằng sáng chế; Fee: thống lĩnh thị trường; Convert fee: switching cost; Price: giá thấp đối thủ không thắng.", "t": "Mẹo: **T-L-F-C-P** = 'Thương hiệu – Licence – Fee – Chuyển đổi – Price'."}, {"ch": 2, "tag": "True/False/NOT", "q": "According to the agency problem theory in the slide, the agency problem is more serious when:", "o": ["Dividends are low, the debt ratio is low and board ownership is low", "Dividends are high, the debt ratio is high and board ownership is high", "Dividends are high but the debt ratio is low and board ownership is low", "Board ownership is high while the debt ratio and dividends are low"], "e": "Lower dividend, lower debt ratio, lower management ownership → serious agency problem. Ví dụ: Coteccons.", "t": "3 chữ 'thấp': cổ tức thấp, nợ thấp, sở hữu quản lý thấp = nguy hiểm."}, {"ch": 2, "tag": "Definition", "q": "Warren Buffett has 4 stock-investing principles. Which of the following is one of them?", "o": ["Evaluate top management for honesty and competence", "Buy the stock with the highest P/E in the sector", "Always follow the crowd when prices are rising fast", "Prefer stocks with the largest short-term price volatility"], "e": "4 principles: management honesty/competence; favorable long-term prospects; stable stocks; reasonable price.", "t": "Buffett: **người quản lý – triển vọng – ổn định – giá hợp lý**."}, {"ch": 2, "tag": "Compare", "q": "Who is regarded as the \"father of value investing\" and Buffett's teacher?", "o": ["Benjamin Graham (Security Analysis)", "Philip Fisher (founded Fisher & Company)", "William O'Neil (creator of CANSLIM)", "Michael Porter (Five Forces model)"], "e": "Graham chỉ mua khi giá < intrinsic value; Fisher tập trung chất lượng quản lý & đặc điểm doanh nghiệp.", "t": "Graham = value, Fisher = quality of management."}, {"ch": 2, "tag": "Calculation", "q": "Current assets and short-term investments = 900, current liabilities = 600, inventories = 300. What is the quick ratio?", "o": ["1.0", "1.5", "0.5", "2.0"], "e": "Quick = (900 − 300)/600 = 1,0 (current ratio = 900/600 = 1,5).", "t": "Quick = (CA − **Inventory**)/CL."}, {"ch": 2, "tag": "True/False/NOT", "q": "Which statement about stock valuation is CORRECT according to the slide?", "o": ["Valuation is subjective and never 100% certain; process matters most", "The more complex the model and the more variables, the more accurate the result", "Valuation results stay fixed and do not change over time", "Valuation is objective and does not depend on the appraiser"], "e": "Valuation: subjective; thay đổi theo thông tin/thời gian; mô hình phức tạp có sai số lớn.", "t": "Hỏi 'đúng' → chọn câu có chữ **subjective / process**."}, {"ch": 2, "tag": "Definition", "q": "The three groups of stock valuation models are:", "o": ["Asset, Relative (market ratio) and Discounted Cash Flow", "Top-down, Bottom-up and Porter's five forces approaches", "CAPM, WACC and Gordon growth discount-rate models", "Fundamental, Technical and Quantitative analysis methods"], "e": "Asset: giá trị tài sản; Relative: P/E, P/B, P/S, PEG; DCF: DDM, FCFE, FCFF.", "t": "**A-R-D**: Asset, Relative, DCF."}, {"ch": 2, "tag": "Calculation", "q": "The correct Asset valuation formula (for investment in Vietnam) is:", "o": ["Firm value = Total assets − Total liabilities + Business advantages + Adjusted real estate value", "Firm value = Total assets + Total liabilities − Business advantages − Adjusted value of real estate", "Firm value = EPS × P/E + Business advantages + Adjusted value of real estate", "Firm value = Dividend/(r − g) + Business advantages + Adjusted value of real estate"], "e": "Net asset value = revalued assets − liabilities; cộng business advantages; đầu tư tại VN cộng thêm chênh lệch bất động sản.", "t": "Tài sản − Nợ + Lợi thế + **BĐS điều chỉnh**."}, {"ch": 2, "tag": "Calculation", "q": "Firm X: average equity over 3 years = 1,023,824,945,558/3, average ROE of X = 21.39%, average industry ROE = 18.57%. What are the business advantages approximately?", "o": ["≈ 9.6 billion VND", "≈ 96 billion VND", "≈ 0.96 billion VND", "≈ 21.4 billion VND"], "e": "BA = bình quân vốn chủ × (R_firm − R_industry) = 341,274,981,853 × (21.39% − 18.57%) ≈ 9,631,493,144 VND (slide: 9.623.954.488 do làm tròn %).", "t": "BA = Equity bình quân × (ROE firm − ROE ngành)."}, {"ch": 2, "tag": "Calculation", "q": "For firm X: total assets 844,206,663,917, liabilities 222,465,665,696, business advantages ≈ 9.63 billion, 12,859,288 shares. What is the value per share approximately?", "o": ["≈ 49,099 VND", "≈ 65,640 VND", "≈ 32,800 VND", "≈ 4,909 VND"], "e": "Giá trị DN ≈ 631,372,491,365; chia 12.859.288 cp ≈ 49,099 (slide ghi 49.098).", "t": "Giá/cp = Firm value ÷ số cp lưu hành."}, {"ch": 2, "tag": "Calculation", "q": "A company has charter capital of 30 billion VND, par value 10,000 VND and 100,000 treasury shares. How many shares are outstanding?", "o": ["2,900,000", "3,000,000", "3,100,000", "300,000"], "e": "Issued = 30 tỷ/10.000 = 3.000.000; lưu hành = issued − treasury = 2.900.000.", "t": "Lưu hành = phát hành − **cổ phiếu quỹ**."}, {"ch": 2, "tag": "Calculation", "q": "A company earned 10 billion VND in 2007. On Jan 1 it had 1 million shares. On Jul 1 it issued 100,000 additional shares (sold at 20,000 VND/share). What is EPS approximately?", "o": ["≈ 9,524 VND", "≈ 9,091 VND", "≈ 10,000 VND", "≈ 9,000 VND"], "e": "Nbq = (1×6 + 1,1×6)/12 = 1,05 triệu → EPS = 10 tỷ/1,05 triệu ≈ 9,524.", "t": "Phát hành thêm để huy động vốn → **tính theo thời gian** (Nbq)."}, {"ch": 2, "tag": "Calculation", "q": "As in the previous question, but the 100,000 shares issued on Jul 1 are BONUS shares / a stock dividend. What is EPS approximately?", "o": ["≈ 9,091 VND", "≈ 9,524 VND", "≈ 10,000 VND", "Both 9,524 and 9,091 are correct"], "e": "Cổ phiếu thưởng/cổ tức phải điều chỉnh hồi tố về đầu năm: Nbq = 1,1 triệu → EPS ≈ 9,091.", "t": "Thưởng/cổ tức bằng cp = **hồi tố đầu năm** (không nhân thời gian)."}, {"ch": 2, "tag": "Calculation", "q": "Company A: net profit 80 billion VND; 7 million common shares and 3 million preferred shares with a 10% dividend (par value 10,000). On Mar 30 it issued 10% of its common shares as a stock dividend; on Jul 1 it issued 3 million additional shares. What is EPS approximately?", "o": ["≈ 8,370 VND", "≈ 8,696 VND", "≈ 8,000 VND", "≈ 9,200 VND"], "e": "Nbq = 9,2 triệu; EPS = (80 tỷ − 3 triệu×10%×10.000)/9,2 triệu ≈ 8,370.", "t": "EPS = (EAT − cổ tức ưu đãi − quỹ phúc lợi)/Nbq."}, {"ch": 2, "tag": "Calculation", "q": "Industry P/E is calculated as:", "o": ["Sum of market capitalization ÷ sum of earnings after tax", "The simple average of the stock prices of the industry's firms", "Sum of EPS of the firms ÷ sum of the stock prices", "Sum of earnings after tax ÷ sum of market capitalization"], "e": "Slide A,B,C: vốn hóa 1.564 tỷ / EAT 101 tỷ = 15.49.", "t": "Industry P/E = ΣMarket cap ÷ ΣEAT (có trọng số)."}, {"ch": 2, "tag": "Calculation", "q": "Industry P/E ≈ 15.49 and firm X's EPS is 2,000 VND. What is X's intrinsic value by the P/E method?", "o": ["≈ 30,970–30,980 VND", "≈ 15,490 VND (the industry P/E itself)", "≈ 7,745 VND (EPS × P/E ÷ 4)", "≈ 129 VND (EPS ÷ P/E)"], "e": "P = EPS × P/E* = 2.000 × 15.4851 ≈ 30,970 (slide ghi 30.980 do làm tròn 15,49).", "t": "P = EPS × P/E dùng để định giá (P/E*)."}, {"ch": 2, "tag": "Calculation", "q": "What is the intrinsic P/E formula in the Gordon model?", "o": ["P/E = (1 − b) × (1 + g)/(r − g), where b is the retention ratio", "P/E = b × (1 + g)/(r − g), where b is the retention ratio of earnings", "P/E = (1 − b) × (1 + g)/(r + g), where b is the retention ratio", "P/E = r/((1 − b) × (1 + g)), where b is the retention ratio"], "e": "P0 = D1/(r−g) = D0(1+g)/(r−g); chia cho EPS0, D0/EPS0 = 1 − b.", "t": "(1−b) = payout. Ví dụ b=40%, g=5%, r=12% → P/E = 0,6×1,05/0,07 = 9.0."}, {"ch": 2, "tag": "Calculation", "q": "If ROE = 15% and the retention ratio b = 40%, what is the sustainable dividend growth rate g?", "o": ["6%", "15%", "25%", "9%"], "e": "g = b × ROE = 0,4 × 15% = 6%.", "t": "g = **b × ROE**."}, {"ch": 2, "tag": "Calculation", "q": "The average market yield is 9%. Using \"P/E = 1/yield\", the acceptable P/E is:", "o": ["≈ 11.1 times", "≈ 9 times", "≈ 0.09 times", "≈ 90 times"], "e": "1/9% = 11,11 (slide ghi 11,2 – làm tròn sai nhẹ).", "t": "P/E = 1 ÷ yield. Yield 9% ↔ P/E ≈ 11."}, {"ch": 2, "tag": "Definition", "q": "What does P/B < 1 mean (according to the slide)?", "o": ["The market price is below book value per share, so the stock may be cheap", "The market price is far above book value per share, so the stock is surely expensive", "The company is certain to go bankrupt in the near future", "The stock is priced higher than its real intrinsic value"], "e": "P/B = P/Book value per share. P/B>1: giá > sổ sách. Ví dụ VNM luôn có P/B cao (4,86–12,95).", "t": "P/B<1 = 'giảm giá so với sổ sách'."}, {"ch": 2, "tag": "Definition", "q": "PEG < 1 indicates that:", "o": ["The stock price is lower than its real (intrinsic) value", "The stock price is higher than its real value", "The stock price is exactly equal to its real value", "The company is currently making losses and pays no dividend"], "e": "PEG = P/E ÷ tốc độ tăng EPS: =1 hợp lý; >1 đắt; <1 rẻ.", "t": "PEG **nhỏ** = **rẻ**."}, {"ch": 2, "tag": "Definition", "q": "P/S is calculated as:", "o": ["Stock price ÷ sales per share, i.e. market cap ÷ sales", "Stock price ÷ earnings per share, i.e. market cap ÷ earnings", "Stock price ÷ book value per share, i.e. market cap ÷ equity", "Total sales ÷ total assets, i.e. the asset turnover ratio"], "e": "P/S = P/(Sales per share) = Total market value/Total sales.", "t": "S = **Sales**. P/E = Earnings, P/B = Book."}, {"ch": 2, "tag": "Calculation", "q": "Using CAPM with Rf = 4%, Rm = 10% and β = 1.12, the required return Rj is:", "o": ["10.72%", "11.20%", "6.72%", "4.72%"], "e": "Rj = Rf + (Rm − Rf)β = 4% + 6%×1,12 = 10,72%.", "t": "CAPM: **Rf + β × (phần bù thị trường)**."}, {"ch": 2, "tag": "Calculation", "q": "The slide computes the beta of stock A as Cov/Var using 12 periods of data. Beta is approximately:", "o": ["≈ 1.12", "≈ 0.89", "≈ 1.50", "≈ 0.50"], "e": "Cov ≈ 313,52; Var ≈ 280,69; β = Cov/Var ≈ 1.117 (>1: biến động mạnh hơn thị trường).", "t": "β = Cov(Ra,Rm)/Var(Rm)."}, {"ch": 2, "tag": "Calculation", "q": "This year's dividend is 1,000 and grows at 5% per year forever; ke = 16%. The stock value (Gordon model) is:", "o": ["9,545", "6,250", "6,563", "19,091"], "e": "V = D1/(ke−g) = 1.050/(16%−5%) = 9.545.", "t": "Gordon dùng **D1** (cổ tức năm tới) = D0×(1+g)."}, {"ch": 2, "tag": "Calculation", "q": "A constant dividend of 1,000 per year and ke = 16%. The stock value is:", "o": ["6,250", "9,545", "16,000", "1,160"], "e": "g = 0 → V = D/ke = 1.000/16% = 6.250.", "t": "Cổ tức hằng số = **perpetuity**: D/ke."}, {"ch": 2, "tag": "Calculation", "q": "A preferred stock has a par value of $60 and a 7% annual dividend; the investor requires 8.5%. What price should the investor pay?", "o": ["≈ $49.41", "≈ $60.00", "≈ $51.00", "≈ $42.00"], "e": "P0 = Dp/r = 60×7%/8,5% = 4,2/0,085 ≈ 49.41$.", "t": "Preferred = perpetuity: **Dp/r** (Dp = mệnh giá × tỷ lệ cổ tức)."}, {"ch": 2, "tag": "Calculation", "q": "A joint stock company has equity of 289,000 (million), average ROE over 3 years of 11.4% and a 5-year government bond rate of 9%. What are the business advantages?", "o": ["≈ 6,936 million", "≈ 32,946 million", "≈ 2,601 million", "≈ 69,360 million"], "e": "BA = VCSH × (ROE bq − lãi suất TPCP) = 289.000 × (11,4% − 9%) = 6.936.", "t": "BA = Equity × (ROE − **lãi trái phiếu chính phủ**)."}, {"ch": 2, "tag": "Calculation", "q": "Continuing: total assets 770,000, liabilities 481,000, business advantages 6,936 and adjusted real estate value 40,000 (million), 11 million shares. What is the price per share approximately?", "o": ["≈ 30,540 VND", "≈ 26,272 VND", "≈ 70,000 VND", "≈ 33,594 VND"], "e": "Firm value = 770.000 − 481.000 + 6.936 + 40.000 = 335,936 triệu → 335,936,000,000/11.000.000 ≈ 30,540 VND.", "t": "Đổi đơn vị: triệu VND × 1.000.000 ÷ số cp."}, {"ch": 2, "tag": "Calculation", "q": "A company's dividends grow at 20% for 3 years, then 15% for 3 years, then 5% forever; D1 (2008) = 1,500 and ke = 10%. The stock value (multistage DDM) is approximately:", "o": ["≈ 48,740", "≈ 30,000", "≈ 68,987", "≈ 38,941"], "e": "V1 ≈ 4.474; V2 ≈ 5.325; V3 ≈ 38.941 → V ≈ 48,740.", "t": "Tách 3 giai đoạn: tổng PV từng năm + **PV của giá trị cuối kỳ (Gordon)**."}, {"ch": 2, "tag": "Calculation", "q": "Photon's WACC: equity of $500,000 costing 7%, debt of $500,000 costing 6%, tax rate 35%. WACC =", "o": ["5.45%", "6.50%", "6.00%", "4.55%"], "e": "WACC = 50%×7% + 50%×6%×(1−35%) = 3,5% + 1,95% = 5,45%.", "t": "Nợ được **lá chắn thuế**: nhân (1 − t)."}, {"ch": 2, "tag": "Definition", "q": "Which company is the DDM model suited to?", "o": ["A steady-growth company that pays most of its earnings as dividends", "A start-up that pays no dividends and keeps making losses every year", "A company with explosive growth in which g is far greater than ke", "A company that retains all of its earnings for reinvestment in projects"], "e": "DDM dùng cổ tức làm dòng tiền duy nhất; cần g < ke.", "t": "DDM cần **cổ tức** & **g < ke**."}, {"ch": 2, "tag": "Compare", "q": "How does FCFF differ from FCFE when computing a stock price?", "o": ["FCFF is discounted at WACC; debt is subtracted before dividing by shares", "FCFF is discounted at ke, while FCFE is discounted at WACC to get firm value", "Both models give the equity value directly, with no debt adjustment", "FCFF does not need the number of shares to get the price per share"], "e": "FCFF = FCFE − Net borrowing + Interest×(1−t). P/share (FCFF) = (Value − Debt)/N.", "t": "FCFE → **ke**, vốn chủ. FCFF → **WACC**, giá trị DN (trừ nợ)."}, {"ch": 2, "tag": "Calculation", "q": "The FCFE formula in the slide is:", "o": ["FCFE = NI + D&A − Capex − ΔWC + Net borrowing", "FCFE = NI − D&A + Capex + ΔWC − Net borrowing", "FCFE = NI + D&A + Capex − ΔWC − Net borrowing", "FCFE = NI + D&A − Capex + ΔWC + Interest × (1 − t)"], "e": "Slide 2005: 22,36 + 7,80 − 13,59 + 87,15 − 87,34 = 16,38 tỷ (ΔWC âm nên cộng lại).", "t": "FCFE = NI + khấu hao − capex − Δ vốn lưu động + vay ròng."}, {"ch": 2, "tag": "Definition", "q": "How many stages does Warren Buffett usually use in the FCFE model?", "o": ["2 stages: 10 years, then year 11 to infinity", "3 stages of 5 years each, then a terminal value", "1 stage lasting 3 years, then liquidation", "5 stages of 2 years each, then a terminal value"], "e": "Slide: Warren Buffett usually chooses only 2 stages; stage 1 lasts 10 years.", "t": "Buffett = **2 giai đoạn, 10 năm**."}, {"ch": 2, "tag": "Trap", "q": "According to the slide, how does Buffett determine the discount rate r?", "o": ["r = Max(inflation, interest rate, risk-free rate) + risk premium", "r = Min(inflation, interest rate, risk-free rate) + investment risk premium", "r = Max(ROE, P/E, dividend yield) + investment risk premium", "r = Min(inflation, ROE) − investment risk premium"], "e": "Một trong bốn cách: CAPM, Gordon, WACC, hoặc kỳ vọng của từng nhà đầu tư (Buffett).", "t": "Buffett: **sàn cao nhất + premium**."}, {"ch": 2, "tag": "True/False/NOT", "q": "What is a limitation of the asset valuation model?", "o": ["It looks only at the past and present, not at future changes", "It depends too heavily on forecasts of distant future cash flows", "It can only be applied to value companies that are making losses", "It cannot be used to value firms undergoing equitization"], "e": "Asset valuation phổ biến trong cổ phần hóa (equitisation), ít nhà đầu tư dùng để định giá cổ phiếu.", "t": "Asset = **backward-looking**."}, {"ch": 3, "tag": "Definition", "q": "A bond is:", "o": ["A fixed-income instrument representing a loan to a borrower", "A certificate of partial ownership of the issuing company", "A contract giving the holder the right to buy shares in the firm", "A demand savings account with no maturity date at a bank"], "e": "Người mua trái phiếu là chủ nợ (creditor) của tổ chức phát hành.", "t": "Bond = **creditor**; Stock = **owner**."}, {"ch": 3, "tag": "True/False/NOT", "q": "Which characteristic is NOT true of bonds?", "o": ["Bond buyers are shareholders with voting rights", "Buyers are creditors of the issuer", "They have a fixed maturity (except perpetual bonds) and a fixed interest rate", "They can be freely transferred on the market"], "e": "Trái phiếu = nợ, không có quyền biểu quyết như cổ phiếu phổ thông.", "t": "'Creditor' vs 'shareholder' – đảo ngược là sai."}, {"ch": 3, "tag": "Definition", "q": "The classification of bonds by maturity in the slide is:", "o": ["Short-term 1–5 years; intermediate 5–12 years; long-term > 12", "Short-term < 1 year; intermediate 1–5 years; long-term > 5 years", "Short-term 1–3 years; intermediate 3–7 years; long-term > 7 years", "Short-term 1–10 years; intermediate 10–20 years; long-term > 20"], "e": "Short 1–5, intermediate 5–12, long > 12 years.", "t": "Số: **5 – 12**."}, {"ch": 3, "tag": "Definition", "q": "The classification of bonds by coupon rate includes:", "o": ["Floating rate bond, Coupon bond and Zero-coupon bond", "Redeemable bond, Convertible bond and Warrant-linked bond", "Government bond, Civil bond and Corporate bond issues", "Domestic bond, Foreign bond and Eurobond issues"], "e": "Theo issuer: Government/civil/corporate. Theo tính chất: redeemable/convertible/warrant. Theo thị trường: domestic/foreign/Eurobond.", "t": "Coupon: **thả nổi – cố định – không coupon**."}, {"ch": 3, "tag": "Definition", "q": "Par value is also called:", "o": ["Face value / face amount / principal amount", "Market value of the bond at the time of issue", "Intrinsic value as estimated by the investor", "Book value per share of the issuing company"], "e": "Par value = giá danh nghĩa ghi trên trái phiếu, là cơ sở để trả nợ gốc.", "t": "Par = Face = Principal."}, {"ch": 3, "tag": "Definition", "q": "As the coupon payment frequency increases (for example from annual to semi-annual), the bond price (according to the slide):", "o": ["Tends to be higher", "Tends to be lower", "Stays exactly unchanged", "Falls to zero"], "e": "Slide: the more frequently a bond makes coupon payments, the higher the bond price.", "t": "Trả lãi **sớm/thường xuyên** hơn = giá **cao hơn**."}, {"ch": 3, "tag": "Definition", "q": "Balloon maturity refers to:", "o": ["A final payment that is much larger than the earlier payments", "A bond whose whole principal matures all at once on one date", "A bond that pays no interest at all before it matures", "A bond whose principal is repaid in equal installments each year"], "e": "3 cấu trúc kỳ hạn: một lần; serial (nhiều đợt theo lịch); balloon (đợt cuối rất lớn).", "t": "Balloon = bóng bay phồng ở **cuối**."}, {"ch": 3, "tag": "Calculation", "q": "A convertible bond has a par value of 1,500,000 VND and a conversion price of 30,000 VND/share. The conversion rate is:", "o": ["50 shares", "30 shares", "500 shares", "0.02 shares"], "e": "Conversion rate = Par/Conversion price = 1.500.000/30.000 = 50.", "t": "Tỷ lệ = Mệnh giá ÷ giá chuyển đổi."}, {"ch": 3, "tag": "Calculation", "q": "For the same convertible bond, the current share price is 35,000 VND. What are the conversion value and the sensible decision?", "o": ["1,750,000 VND; convert because it exceeds par", "1,500,000 VND; converting is beneficial since P = X", "1,250,000 VND; convert because the price is above 30,000", "1,750,000 VND; do not convert, since the bond is a loan"], "e": "Conversion value = 50 × 35.000 = 1.750.000 > 1.500.000 → có lợi.", "t": "Conversion value = số cp nhận × giá cp hiện tại."}, {"ch": 3, "tag": "Calculation", "q": "A convertible bond has a par value of 1,000,000, a conversion price of 50,000/share and a share price of 55,000. The bond's market price is 1,120,000 and the company will buy it back at 1,110,000. Which option is best?", "o": ["Sell the bond on the market at 1,120,000", "Convert the bond into 20 common shares and hold them", "Sell the bond back to the company at 1,110,000", "None of the options is better than the others"], "e": "Chuyển đổi: 20 cp × 55.000 = 1.100.000 < 1.110.000 < 1.120.000 → bán thị trường.", "t": "So 3 giá trị: chuyển đổi / bán cty / bán thị trường, chọn lớn nhất."}, {"ch": 3, "tag": "Calculation", "q": "A bond has a face value of $1,000 and a conversion price of $40. The bond trades at $1,150, the share at $48, and the company will buy back at $1,120. Which option should the investor choose?", "o": ["Convert into shares ($1,200)", "Sell on the market ($1,150)", "Sell back to the company ($1,120)", "None of the options"], "e": "Conversion: 1.000/40 = 25 cp × 48 = 1.200$ > 1.150 > 1.120.", "t": "Số cp = Par/giá chuyển đổi; nhân giá cp."}, {"ch": 3, "tag": "Definition", "q": "The seven main risks of investing in bonds in the slide are:", "o": ["Interest rate, Credit, Inflation, Liquidity, Currency, Reinvestment and Tax", "Market, Operational, Legal, Political, Settlement, Systemic and Model risk", "Interest rate, Credit, Inflation, Liquidity, Business, Financial and Tax risk", "Interest rate, Credit, Beta, Liquidity, Exchange rate, Reinvestment and Tax risk"], "e": "Slide liệt kê 7 loại rủi ro.", "t": "Mẹo **L-T-L-C-G-T-Ti** hơi khó; dùng câu: **'Lãi – Tín – Lạm – Thanh – Giá hối – Tái – Thuế'**."}, {"ch": 3, "tag": "True/False/NOT", "q": "Which risk is NOT in the slide's list of bond risks?", "o": ["Equity price volatility (beta) risk", "Reinvestment risk on coupons received", "Tax risk from changes in the tax rate", "Liquidity risk in the secondary market"], "e": "Beta không được liệt kê trong 7 rủi ro trái phiếu.", "t": "KHÔNG → chọn thứ không thuộc 7 rủi ro."}, {"ch": 3, "tag": "Definition", "q": "What is the relationship between the market interest rate and bond prices?", "o": ["Rates rise → prices fall; rates fall → prices rise", "When interest rates rise, bond prices rise as well", "The two variables are unrelated to each other, in any case", "When interest rates fall, bond prices fall as well"], "e": "Lãi suất cao nơi khác nên trái phiếu coupon cũ mất hấp dẫn.", "t": "**Seesaw (bập bênh)**: lãi suất ↑ ⇒ giá ↓."}, {"ch": 3, "tag": "True/False/NOT", "q": "Which statement about interest rate risk is CORRECT?", "o": ["Longer maturity and a lower coupon mean a greater effect on the price", "The longer the maturity, the smaller the effect of interest rates on the price", "The higher the coupon, the more sensitive the price is to interest rates", "It mainly affects floating-rate bonds rather than fixed-rate bonds"], "e": "Slide: longer maturity, lower coupon → greater effect; fixed-rate bonds affected, floating little.", "t": "Dài + coupon thấp = **nhạy cảm nhất**."}, {"ch": 3, "tag": "Definition", "q": "Credit risk is the risk that:", "o": ["The issuer cannot pay interest or principal when due", "The bond price falls because market interest rates rise", "It is hard to find a buyer when the investor wants to sell", "The purchasing power of coupons falls because of inflation"], "e": "Hạn chế bằng xếp hạng (Moody's, S&P, Fitch), tài sản đảm bảo/bảo lãnh, phân tích tổ chức phát hành.", "t": "Credit = default."}, {"ch": 3, "tag": "Definition", "q": "In the credit rating scale, from which rating are bonds considered \"junk\"?", "o": ["Ba1/BB+ and below", "Baa3/BBB− and below", "A1/A+ and below", "Caa1/CCC+ and below"], "e": "Investment grade: tới Baa3/BBB−. Từ Ba1/BB+ là speculative (junk).", "t": "BBB− còn 'đầu tư được', BB+ là **rác**."}, {"ch": 3, "tag": "Definition", "q": "Which is the highest rating, with the lowest credit risk?", "o": ["Aaa (Moody's) / AAA (S&P)", "Aa1 (Moody's) / AA+ (S&P)", "A1 (Moody's) / A+ (S&P)", "Baa1 (Moody's) / BBB+ (S&P)"], "e": "Aaa/AAA risk premium = 0.", "t": "Aaa → càng nhiều 'a' càng tốt; càng nhiều 'C' càng xấu."}, {"ch": 3, "tag": "Compare", "q": "Which statement about liquidity risk is correct?", "o": ["Government bonds tend to be more liquid than corporate bonds", "Corporate bonds are always more liquid than government bonds of any size", "It affects individual investors more strongly than institutional ones", "It does not depend on the activity of the secondary bond market"], "e": "Phát hành lớn → thanh khoản tốt; trái phiếu thanh khoản nhất ngay sau khi phát hành.", "t": "Government bond = thanh khoản cao."}, {"ch": 3, "tag": "Calculation", "q": "A U.S. investor buys a euro bond with a EUR 10,000 coupon; the exchange rate falls from 1 EUR = 1.5 USD to 1.4 USD. How much less USD does the investor receive than expected?", "o": ["USD 1,000 less than expected", "USD 10,000 less than expected", "USD 1,500 less than expected", "USD 100 less than expected"], "e": "10.000×(1,5−1,4) = 1.000 USD. EUR mất giá → exchange rate risk.", "t": "Đổi sang nội tệ: ngoại tệ mất giá → thiệt."}, {"ch": 3, "tag": "Definition", "q": "Reinvestment risk occurs when:", "o": ["Interest rates fall, so coupons are reinvested at lower rates", "Interest rates rise and the market price of the bond falls below par", "The tax rates on bond income change from one year to the next", "The exchange rate between two currencies fluctuates over time"], "e": "Rủi ro tái đầu tư ngược chiều với rủi ro lãi suất.", "t": "Reinvest = lãi **giảm** thì hại."}, {"ch": 3, "tag": "Calculation", "q": "A bond has a par value of 100,000 and a 10% coupon, and is bought at 96,000. The current yield =", "o": ["10.42%", "10.00%", "11.08%", "9.60%"], "e": "Current yield = coupon hằng năm / giá thị trường = 10.000/96.000 = 10,42%.", "t": "Current yield = **Coupon ÷ giá hiện tại** (không ÷ mệnh giá)."}, {"ch": 3, "tag": "Calculation", "q": "For the same bond (par value 100,000, 10% annual coupon, 5 years, price 96,000, annual payments), the YTM is approximately:", "o": ["≈ 11.08%", "≈ 10.42%", "≈ 10.00%", "≈ 12.5%"], "e": "Giải 96 = 10/y×(1−(1+y)^−5)+100/(1+y)^5 → y ≈ 11.08% (slide: 11,08%).", "t": "Mua dưới mệnh giá (discount) ⇒ YTM > current yield > coupon rate."}, {"ch": 3, "tag": "Calculation", "q": "The approximate YTM formula is: RI = CF + (Face − Price)/n; YTM = RI / ((Price + Face)/2). For the bond above, the result is approximately:", "o": ["≈ 11.02%", "≈ 10.42%", "≈ 14.00%", "≈ 8.00%"], "e": "RI = 10.000 + 4.000/5 = 10.800; giá TB = 98.000; YTM xấp xỉ = 11.02% (gần 11,08% chính xác).", "t": "Xấp xỉ = (Coupon + lãi vốn/năm) ÷ giá trung bình."}, {"ch": 3, "tag": "Calculation", "q": "A 5-year 8% bond with a face value of 1,000 sells at 925. The theoretical price is 961.10 at 9% and 924.18 at 10%. Interpolating, the YTM is approximately:", "o": ["≈ 9.98%", "≈ 9.00%", "≈ 10.50%", "≈ 11.00%"], "e": "Tính 961.10 và 924.18; YTM ≈ 9% + (961,10−925)/(961,10−924,18)×1% ≈ 9.98%.", "t": "Giá 925 sát 924,18 ⇒ YTM gần 10%."}, {"ch": 3, "tag": "Calculation", "q": "Bond XYZ has a par value of 100,000, a 12% annual coupon, 5 years to maturity, a price of 90,000 and annual payments. The YTM is approximately:", "o": ["≈ 14.98%", "≈ 12.00%", "≈ 7.11%", "≈ 13.33%"], "e": "Giá thấp hơn mệnh giá ⇒ YTM > 12%. Tính ra ≈ 14.98% (trả nửa năm ≈ 29.82% danh nghĩa/năm).", "t": "Discount ⇒ YTM **>** coupon."}, {"ch": 3, "tag": "Calculation", "q": "The same 12% coupon, 5-year bond, but with a price of 120,000 and annual payments. The YTM is approximately:", "o": ["≈ 7.11%", "≈ 12.00%", "≈ 14.98%", "≈ 16.67%"], "e": "Giá cao hơn mệnh giá (premium) ⇒ YTM < coupon. ≈ 7.11% (nửa năm ≈ 14.34%).", "t": "Premium ⇒ YTM **<** coupon."}, {"ch": 3, "tag": "Calculation", "q": "What is the price of a 10-year zero-coupon bond with a par value of 1,000,000 VND and a required return of 12%?", "o": ["≈ 321,973 VND", "≈ 1,200,000 VND", "≈ 892,857 VND", "≈ 453,000 VND"], "e": "P = F/(1+y)^n = 1.000.000/1,12^10 ≈ 321,973.", "t": "Zero: **chỉ chiết khấu mệnh giá**."}, {"ch": 3, "tag": "Calculation", "q": "A 15-year zero-coupon bond has a par value of 1,000,000 VND and a required return of 14%. Its price is:", "o": ["≈ 140,096 VND", "≈ 210,000 VND", "≈ 476,190 VND", "≈ 1,000,000 VND"], "e": "P = 1.000.000/1,14^15 ≈ 140,096.", "t": "P = F/(1+y)^n."}, {"ch": 3, "tag": "Calculation", "q": "A perpetual bond pays $50 per year and the required return is 12%. Its price =", "o": ["≈ $416.67", "≈ $600.00", "≈ $50.00", "≈ $6.00"], "e": "P = I/R = 50/0,12 = 416,67.", "t": "Perpetual = **CF/y**."}, {"ch": 3, "tag": "Calculation", "q": "A 10-year bond has a par value of 100,000, a 10.5% annual coupon (paid annually) and a discount rate of 12%. Its price is approximately:", "o": ["≈ 91,525 VND", "≈ 91,398 VND", "≈ 100,000 VND", "≈ 105,000 VND"], "e": "P = 10.500×(1−1,12^−10)/0,12 + 100.000/1,12^10 ≈ 91,525; trả nửa năm ≈ 91,398.", "t": "Coupon < lãi chiết khấu ⇒ giá < mệnh giá (discount)."}, {"ch": 3, "tag": "Definition", "q": "When the coupon rate is higher than the market interest rate, the bond sells at:", "o": ["A premium (above par value)", "A discount (below par value)", "Exactly par value (equal to face value)", "A price that cannot be determined without the maturity"], "e": "Coupon > market ⇒ premium; coupon < market ⇒ discount; coupon = market ⇒ par.", "t": "Coupon **hơn** thị trường ⇒ giá **hơn** mệnh giá."}, {"ch": 3, "tag": "Calculation", "q": "A bond has a 10% coupon (par value 100,000, annual payments) and the market rate is 11%. What are its prices with 1 year and with 2 years left to maturity?", "o": ["99,099 and 98,287", "100,917 and 101,759", "100,000 for both", "110,000 and 120,000"], "e": "Coupon < market ⇒ discount; kỳ hạn càng dài giá càng thấp: 110.000/1,11 ≈ 99,099; 2 năm ≈ 98,287.", "t": "Coupon < lãi: **dài hơn ⇒ thấp hơn**."}, {"ch": 3, "tag": "Definition", "q": "When the coupon rate equals the market interest rate, the bond price:", "o": ["Equals par value, whatever the maturity", "Is above par value when the maturity is long", "Is below par value when the maturity is long", "Is zero when the bond is close to maturity"], "e": "Slide: nominal = market ⇒ price independent of maturity, equals face value.", "t": "Bằng nhau ⇒ giá = **par**."}, {"ch": 3, "tag": "Definition", "q": "At HNX, the ex-coupon date is determined as:", "o": ["14 days before the payment date", "30 days before the interest payment date", "Exactly on the interest payment date", "7 days after the interest payment date"], "e": "Mua vào hoặc sau ex-coupon date thì người bán giữ quyền nhận coupon kế tiếp.", "t": "Số **14**."}, {"ch": 3, "tag": "Calculation", "q": "The annual coupon is 9,000 and the seller held the bond for 90 days of a 365-day period. Accrued interest =", "o": ["≈ 2,219 VND", "≈ 9,000 VND", "≈ 2,250 VND", "≈ 22,190 VND"], "e": "Accrued = CF × (số ngày người bán giữ / số ngày trong kỳ) = 9.000×90/365 ≈ 2,219. Dirty price = clean + accrued (94.746 + 2.219 = 96.965).", "t": "Dirty (full/invoice) = Clean + Accrued."}, {"ch": 3, "tag": "True/False/NOT", "q": "What does the slide say about Excel when pricing a bond between coupon dates?", "o": ["Excel returns the quoted (clean) price, not the settlement price", "Excel always gives the actual (dirty) settlement price of the trade", "Manual calculation gives the quoted (clean) exchange price", "The two methods always give exactly the same price result"], "e": "Manual = settlement (dirty/full) price; Excel = quoted price on the exchange.", "t": "Excel = **quote/clean**."}, {"ch": 3, "tag": "Definition", "q": "Macaulay duration is:", "o": ["The PV-weighted average maturity of the cash flows", "The time remaining until the maturity date of the bond", "The percentage change in price when rates move by 1%", "The change in the bond's convexity when yields change"], "e": "D = Σ t×PV(CF_t)/P = Σ t×w_t.", "t": "Duration = **thời gian thu hồi vốn trung bình**."}, {"ch": 3, "tag": "Calculation", "q": "A 5-year bond has a 6% coupon, a face value of $1,000, a YTM of 4% and annual payments. Its Macaulay duration is approximately:", "o": ["≈ 4.49 years", "≈ 5.00 years", "≈ 4.00 years", "≈ 4.32 years"], "e": "Giá ≈ 1089.04$; D = Σ t×PV/P ≈ 4.4902 năm (Modified ≈ 4.32).", "t": "Coupon > 0 ⇒ duration < kỳ hạn."}, {"ch": 3, "tag": "Compare", "q": "Two bonds each have a value of 100; Bond 1 has a duration of 1.7 and Bond 2 a duration of 2.3. According to the slide, an investor would choose:", "o": ["Bond 1 (lower duration, faster payback)", "Bond 2 (higher duration, slower payback)", "There is no difference between the two bonds", "It is impossible to choose between them"], "e": "Slide: investors will choose bonds with low Duration.", "t": "Duration **thấp** = hoàn vốn **nhanh**, ít nhạy lãi suất."}, {"ch": 3, "tag": "Calculation", "q": "A 3-year bond has a 10% coupon, a face value of $100, a price of $107.87, a 7% discount rate and annual payments. What are its Macaulay and Modified durations?", "o": ["2.7458 and 2.5661", "2.7458 and 2.7458", "3.0000 and 2.8037", "2.5661 and 2.7458"], "e": "D = 2.7458; D* = D/(1+y) = 2.7458/1,07 = 2.5661.", "t": "Modified = Macaulay ÷ (1 + y)."}, {"ch": 3, "tag": "Calculation", "q": "Continuing the problem above: the interest rate rises from 7% to 7.1% (Δy = 0.1%). The price changes by approximately:", "o": ["Falls ≈ $0.2768, new price ≈ $107.5961", "Rises ≈ $0.2768, new price ≈ $108.1497", "Falls ≈ $2.768, new price ≈ $105.1049", "Falls ≈ $0.02566, new price ≈ $107.8472"], "e": "ΔP/P = −D*×Δy = −2.5661×0,001 = −0,2566%; ΔP ≈ −0,2768 → P ≈ 107,59.", "t": "ΔP/P = −D* × Δy. Lãi tăng ⇒ giá giảm."}, {"ch": 3, "tag": "Definition", "q": "What is convexity used for?", "o": ["To improve duration for large rate changes", "To calculate the nominal interest rate of a bond", "To determine the credit rating of the issuer", "To compute the tax payable on the bond income"], "e": "ΔP/P ≈ −D*Δy + ½·Convexity·(Δy)².", "t": "Duration = bậc 1; Convexity = bậc 2 (Taylor)."}, {"ch": 3, "tag": "True/False/NOT", "q": "Which of the following is NOT a benefit of duration?", "o": ["Accurately forecasting future market interest rates", "Measuring the weighted average maturity of a bond", "Measuring price fluctuation when interest rates change", "Supporting interest rate risk hedging (immunization)"], "e": "Khi thời gian đầu tư = duration, ảnh hưởng của biến động lãi suất được hạn chế.", "t": "Duration đo **độ nhạy**, không dự báo lãi suất."}, {"ch": 3, "tag": "True/False/NOT", "q": "Which bond is most affected by interest rate changes (all else equal)?", "o": ["Long maturity and low coupon", "Short maturity and high coupon", "Short maturity and low coupon", "Floating rate with long maturity"], "e": "Longer maturity & lower coupon ⇒ greater duration ⇒ greater sensitivity.", "t": "Tổ hợp **dài + thấp** = nhạy nhất."}, {"ch": 3, "tag": "Definition", "q": "A bond issued in foreign currency on a foreign market is called a:", "o": ["Eurobond (by issuing market)", "Convertible bond (by bond properties)", "Zero-coupon bond (by coupon rate)", "Serial bond (by maturity structure)"], "e": "Issuing market: Domestic bond, Foreign bond, Eurobond.", "t": "Theo thị trường: domestic / foreign / Euro."}, {"ch": 4, "tag": "Definition", "q": "What are the three characteristics of a derivative security?", "o": ["Depends on an underlying asset, is not self-born, trades independently", "Fixed price, no risk and voting rights, issued directly by the company", "Traded only OTC, with no underlying asset, and paying regular dividends", "Issued by the central bank, with a fixed price and a perpetual life"], "e": "Derivative = derived from underlying asset.", "t": "**Depend – Derive – Independent trading**."}, {"ch": 4, "tag": "Definition", "q": "An option is a contract in which the buyer has:", "o": ["The right, not the obligation, to buy or sell the asset", "The obligation to buy or sell the asset at the strike price", "The right to receive dividends from the underlying company", "The right to vote at the general meeting of the company"], "e": "Right, not obligation. Hai loại: call (mua) và put (bán).", "t": "Option = **right**; Futures = **obligation**."}, {"ch": 4, "tag": "Compare", "q": "What is the difference between a European option and an American option?", "o": ["European: exercised only at expiry; American: any time up to expiry", "European: exercisable at any time before expiry; American: only at expiry", "Both can be exercised only on the expiration date, with no early exercise", "Both can be exercised at any time up to the expiration date, early or late"], "e": "Slide: European at expiry; US type any time before expiry.", "t": "**E**uropean = **E**nd date; American = Any time."}, {"ch": 4, "tag": "Definition", "q": "The call option buyer pays the seller an amount called the:", "o": ["Option premium (the fee)", "Initial margin deposit", "Strike price (exercise price)", "Coupon payment"], "e": "Buyer pays premium; seller nhận phí và có nghĩa vụ bán nếu buyer thực hiện.", "t": "Premium = phí mua quyền."}, {"ch": 4, "tag": "Calculation", "q": "An investor buys a call on 1,000 XYZ shares, strike price 40,000, premium 2,000/share. The price at expiration is 60,000. What are the profit/loss and the return?", "o": ["Profit of 18,000,000 VND; return of 900%", "Profit of 20,000,000 VND; return of 1,000%", "Loss of 2,000,000 VND; return of −100%", "Profit of 18,000 VND; return of 9%"], "e": "Profit = (S − X − C)×1000 = (60.000−40.000−2.000)×1000 = 18.000.000; phí bỏ ra 2.000.000 ⇒ 900%.", "t": "Call buyer: LN = S − (X + C) nếu S > X."}, {"ch": 4, "tag": "Calculation", "q": "For the same call (strike 40,000, premium 2,000, 1,000 shares), the price at expiration is 30,000. What is the result?", "o": ["Loss of 2,000,000 VND (−100%)", "Loss of 10,000,000 VND (−500%)", "Profit of 8,000,000 VND (+400%)", "Loss of 12,000,000 VND (−600%)"], "e": "S < X: không thực hiện, lỗ tối đa = premium = 2.000×1000.", "t": "Call buyer lỗ tối đa = **premium**."}, {"ch": 4, "tag": "Calculation", "q": "An investor buys a put on 1,000 XYZ shares, strike 40,000, premium 2,000. The price at expiration is 30,000. What is the profit?", "o": ["Profit of 8,000,000 VND (+400%)", "Loss of 2,000,000 VND (−100%)", "Profit of 10,000,000 VND (+500%)", "Profit of 12,000,000 VND (+600%)"], "e": "Put buyer: LN = X − (S + C) = 40.000 − 32.000 = 8.000/cp ⇒ 8.000.000.", "t": "Put thắng khi S **giảm** dưới X − C."}, {"ch": 4, "tag": "Calculation", "q": "Buying a put (strike 40,000, premium 2,000, 1,000 shares) with a price at expiration of 60,000. What is the result?", "o": ["Loss of 2,000,000 VND (−100%)", "Profit of 18,000,000 VND (+900%)", "Profit of 20,000,000 VND (+1,000%)", "Loss of 20,000,000 VND (−1,000%)"], "e": "S > X: put không có giá trị thực hiện, lỗ = premium.", "t": "S > X: put chết."}, {"ch": 4, "tag": "Calculation", "q": "The break-even point of a call BUYER is:", "o": ["S = X + C (strike plus premium)", "S = X − C (strike minus premium)", "S = X (the strike price)", "S = C (the premium only)"], "e": "Call buyer lãi khi S > X + C.", "t": "Call: **cộng** premium; Put: **trừ** premium."}, {"ch": 4, "tag": "Calculation", "q": "The break-even point of a put BUYER is:", "o": ["S = X − C (strike minus premium)", "S = X + C (strike plus the premium)", "S = X (the strike price)", "S = C (the premium only)"], "e": "Put buyer lãi khi S < X − C.", "t": "Put: X − C."}, {"ch": 4, "tag": "Compare", "q": "What is the profit/loss of the call option SELLER (short call)?", "o": ["Profit capped at the premium C; loss unlimited as S rises", "Unlimited profit, with the maximum loss equal to the premium", "Maximum profit = X − C, with a loss limited to the premium", "Always breaks even, whatever the price at expiration"], "e": "LNs = C nếu S < X; (X − S) + C nếu S > X.", "t": "Seller là **hình ảnh gương** của buyer."}, {"ch": 4, "tag": "Compare", "q": "When the market price S falls sharply below X − C, the put seller (short put) will:", "o": ["Lose money (maximum loss X − C per share at S = 0)", "Gain without limit as the price keeps falling", "Gain only the premium C, whatever the price at expiry", "Break even at expiry, regardless of the price"], "e": "LNs = C nếu S > X; (S + C) − X nếu S < X.", "t": "Short put: lãi tối đa = C."}, {"ch": 4, "tag": "Compare", "q": "How do OTC options differ from listed options?", "o": ["OTC options are negotiated directly and cannot be resold before maturity", "OTC options are standardized in contract terms, while listed options are negotiated", "Both are standardized, with fixed strike prices and expiry dates", "Listed options do not trade on an exchange but only between banks"], "e": "Listed options: standardized strike prices, expiration, settlement & clearing.", "t": "Standardized = Exchange/Listed."}, {"ch": 4, "tag": "Definition", "q": "Which exchange, established in April 1973, was the world's first centralized options market?", "o": ["Chicago Board Options Exchange (CBOE)", "Chicago Mercantile Exchange (CME) in 1874", "Chicago Board of Trade (CBOT), the grain exchange", "EUREX (Germany and Switzerland)"], "e": "CBOE (1973) – largest options trading platform.", "t": "CBOE = Options, 1973."}, {"ch": 4, "tag": "Compare", "q": "What is the basic difference between a forward and a futures contract?", "o": ["Forward: customized OTC deal; futures: standardized, listed", "Forward: standardized; futures: customized between two parties", "Both are standardized contracts traded on a central exchange", "A forward carries no obligation to buy or sell at all"], "e": "Futures còn có ký quỹ và thanh toán bù trừ hằng ngày.", "t": "Forward = Flexible (OTC); Futures = Fixed (sàn)."}, {"ch": 4, "tag": "Compare", "q": "What is the difference between an option and a futures contract?", "o": ["Option: the buyer has a right; futures: both sides are obliged", "Option: the buyer has an obligation; futures: both sides have a right", "Both are only rights and carry no obligations for either party", "Both are obligations of the buyer and the seller at maturity"], "e": "Futures buyer obligation to buy; seller obligation to deliver.", "t": "Option = quyền; Futures = nghĩa vụ."}, {"ch": 4, "tag": "True/False/NOT", "q": "Which component is NOT one of the 5 main components of a futures contract?", "o": ["Option premium", "Type of underlying asset", "Contract size", "Expiration date / delivery procedures / futures price"], "e": "5 thành phần: underlying, size, expiration, delivery procedures, futures price.", "t": "Premium là của **option**."}, {"ch": 4, "tag": "Definition", "q": "The futures market began with the founding of the:", "o": ["Chicago Board of Trade (CBOT), for agricultural goods", "Chicago Board Options Exchange (CBOE), for listed options", "EUREX, the alliance between Germany and Switzerland", "CME in 1971, for currency and securities futures"], "e": "CME ra đời 1874; futures trên chứng khoán/tiền tệ từ 1971.", "t": "CBOT = nông sản đầu tiên."}, {"ch": 4, "tag": "Definition", "q": "Futures on securities and currencies began trading in:", "o": ["1971", "1874", "1973", "2000"], "e": "120 năm đầu chủ yếu hàng hóa; đến 1971 mới có futures chứng khoán/tiền tệ.", "t": "1874 = CME; 1971 = futures tài chính; 1973 = CBOE."}, {"ch": 4, "tag": "Definition", "q": "To trade futures, an investor must open a margin account and post an initial margin. What happens if the balance falls below the maintenance margin?", "o": ["The investor gets a margin call and must deposit more funds", "The contract is automatically cancelled without any notice", "All of the margin is refunded to the investor at once", "Nothing is required of the investor until the contract expires"], "e": "Trung tâm bù trừ định giá lại hằng ngày (daily clearing/marking to market).", "t": "Margin call khi **số dư < maintenance**."}, {"ch": 4, "tag": "Calculation", "q": "A gold contract of 100 oz has an initial margin of $19,000 and a maintenance margin of $9,500. The price moves from 950 to 960 (day 2). What are the profit/loss of the long and short positions?", "o": ["Long +$1,000 (20,000); short −$1,000 (18,000)", "Long −$1,000 (balance 18,000); short +$1,000 (balance 20,000)", "Long +$960 (balance 19,960); short −$960 (balance 18,040)", "Both sides gain $1,000 (20,000 each)"], "e": "Chênh lệch giá 10 × 100 oz = 1.000$ chuyển từ short sang long.", "t": "Zero-sum: long được thì short mất."}, {"ch": 4, "tag": "Calculation", "q": "According to the slide's table, on 8/8/2009 the gold price is 1,080 and the short account balance is $6,000 (< $9,500). What happens?", "o": ["Margin call: the short must deposit more margin", "The long position must deposit additional margin", "Neither side has to deposit anything additional", "The contract is cancelled and the money returned"], "e": "Ngày 7/8 short còn 10.000 ≥ 9.500; sang 8/8 còn 6.000 < 9.500 ⇒ margin call.", "t": "So số dư tài khoản với **maintenance**."}, {"ch": 4, "tag": "Compare", "q": "How does an open-end fund differ from a closed-end fund?", "o": ["Open-end funds deal with the manager; closed-end funds trade on the market", "Open-end funds raise capital once; closed-end funds keep issuing certificates", "Closed-end funds buy back certificates directly from the fund manager", "The two fund types are identical in size, life and liquidity"], "e": "Closed-end: không được bán lại cho công ty quản lý quỹ nhưng giao dịch trên sàn.", "t": "Open = mở cửa liên tục; Closed = đóng sổ, bán lại trên sàn."}, {"ch": 4, "tag": "Definition", "q": "A hedge fund is described as:", "o": ["An actively managed pool using varied strategies to beat the market", "A passive fund that simply tracks a market index at a very low cost", "A public fund that buys only blue-chip stocks and never uses leverage", "An insurance fund managed by a bank to protect all of its depositors"], "e": "Hedge funds: actively managed, risky alternative investment.", "t": "Hedge = chủ động, đòn bẩy, rủi ro."}, {"ch": 4, "tag": "Definition", "q": "Private equity is:", "o": ["Capital not listed on a public exchange, invested in private firms", "Capital raised from the public through listed shares on the exchange", "Capital lent to governments through long-term treasury bonds", "Money deposited with banks and earning a fixed deposit rate"], "e": "PE: buyouts, delisting of public equity; vốn từ tổ chức và cá nhân.", "t": "Private = **không niêm yết**."}, {"ch": 4, "tag": "True/False/NOT", "q": "Which statement about real estate investment in the slide is CORRECT?", "o": ["A house depreciates but land does not, so location matters", "Neither the house nor the land loses value as the years pass", "A new house is always worth more, whatever its location", "There is no need to check the red book or legal title"], "e": "Quy trình: mục đích → loại hình → thời điểm → kiểm tra pháp lý.", "t": "Land > house; **location, location**."}, {"ch": 4, "tag": "Definition", "q": "Which central banks does the slide say do not accept cryptocurrency?", "o": ["Bolivia, Nepal, Algeria and Morocco", "The United States, UK, Japan and Germany", "France, Italy, Spain and Portugal, among others", "China, India, Brazil and Russia"], "e": "Slide: Bolivia, Nepal, Algeria and Morocco.", "t": "B-N-A-M."}, {"ch": 5, "tag": "Definition", "q": "The three basic assumptions of technical analysis are:", "o": ["Price covers everything; prices follow trends; history repeats itself", "Prices are random; information is private; markets are perfectly efficient", "Prices reflect profits only; dividends set prices; P/E is constant", "Exchange rates set prices; interest rates are fixed; the market is closed"], "e": "TA assumptions: price discounts everything; trends; history repeats (human nature).", "t": "**Giá – Xu hướng – Lặp lại**."}, {"ch": 5, "tag": "Definition", "q": "Who is regarded as the father of Dow theory and the founder of The Wall Street Journal?", "o": ["Charles Dow", "Warren Buffett", "Benjamin Graham", "Harry Markowitz"], "e": "Dow theory: nền tảng của phân tích kỹ thuật.", "t": "Dow → TA."}, {"ch": 5, "tag": "Definition", "q": "A line chart is usually drawn by:", "o": ["Connecting closing prices; it is used to see long-term trends", "Connecting opening prices; it is mainly used for intraday trading", "Connecting the highest and lowest prices; it shows daily ranges", "Drawing volume bars; it is used only to show trading volume"], "e": "Line = closing prices. Bar chart (phương Tây), candlestick (Nhật).", "t": "Line = **close**."}, {"ch": 5, "tag": "True/False/NOT", "q": "Which statement about technical analysis is CORRECT according to the slide?", "o": ["TA is an art and only signals supply and demand pressure", "TA can predict future prices with absolute precision", "TA works best when the analyst demands black-and-white answers", "TA does not need any price or volume data to work"], "e": "Dự đoán chính xác giá bằng TA là sai lầm.", "t": "TA = art, không phải khoa học chính xác."}, {"ch": 5, "tag": "Definition", "q": "What is technical analysis used to decide?", "o": ["When to enter the market, take profit and cut losses", "The intrinsic value of a company based on its cash flows", "Which industry will grow faster than GDP in the future", "The weighted average cost of capital of a firm"], "e": "TA: dùng giá và khối lượng để tìm quy luật vận động quá khứ → dự báo xu hướng.", "t": "TA = **timing**."}, {"ch": 5, "tag": "Definition", "q": "Which group of indicators belongs to the \"momentum indicators\" in the slide?", "o": ["RSI, Stochastic, ROC, Momentum", "MA, MACD, Bollinger Band, Envelopes", "Parabolic SAR, Envelopes, Bollinger Band", "Dow theory, Elliott wave, Gann angles"], "e": "Trailing: MA, MACD, Bollinger, Envelopes, Parabolic SAR. Momentum: RSI, Stochastic, ROC, Momentum.", "t": "Momentum: **RSI – Stoch – ROC**."}];
const NOTES={"1": {"nho": "<div class=fcs><div class=flip tabindex=0><div class=ff><div class=front><span class=hint>tap ↻</span><b>Investment (Bodie)</b></div><div class=back><div><b>Current commitment</b> of money/resources → expecting <b>future benefits</b></div><p class=mt>💡 Bỏ ra bây giờ – hưởng sau</p></div></div></div><div class=flip tabindex=0><div class=ff><div class=front><span class=hint>tap ↻</span><b>Graham &amp; Dodd</b></div><div class=back><div><b>Thorough analysis</b>, <b>safety of principal</b>, <b>satisfactory return</b></div><p class=mt>💡 3 chữ: Thorough–Safety–Satisfactory</p></div></div></div><div class=flip tabindex=0><div class=ff><div class=front><span class=hint>tap ↻</span><b>3 loại đầu tư</b></div><div class=back><div>Interest-bearing (money market, bond) | Equities (common, preferred) | Derivatives &amp; others (options, futures, PE, hedge fund, ETF, gold, forex, real estate, commodities, crypto)</div><p class=mt>💡 Lãi – Vốn – Phái sinh</p></div></div></div><div class=flip tabindex=0><div class=ff><div class=front><span class=hint>tap ↻</span><b>8 bước quy trình</b></div><div class=back><div>Objectives → Asset allocation → Law → Find opportunities → Analyze → Market timing → Disbursement → Track (take profit / cut loss)</div><p class=mt>💡 Mục–Phân–Luật–Tìm–Phân tích–Thời điểm–Giải ngân–Theo dõi</p></div></div></div><div class=flip tabindex=0><div class=ff><div class=front><span class=hint>tap ↻</span><b>6 sai lầm (CNBC)</b></div><div class=back><div>Chốt lời sớm • Sợ cắt lỗ • Herd effect • Nghe người nổi tiếng • Quản lý thời gian kém • Quên sở trường</div><p class=mt>💡 Sớm–Sợ–Bầy–Sao–Giờ–Sở trường. Lãi thì kiên nhẫn, lỗ thì cắt</p></div></div></div><div class=flip tabindex=0><div class=ff><div class=front><span class=hint>tap ↻</span><b>Fundamental</b></div><div class=back><div>Kinh tế + doanh nghiệp; trả lời <b>why</b>; cổ phiếu tốt/xấu; <b>dài hạn</b></div><p class=mt>💡 F = Why = dài hạn</p></div></div></div><div class=flip tabindex=0> n điều lệ ÷ mệnh giá.</p></div><div class=fc><h4>Business advantages</h4><code>BA = VCSH bq × (ROE firm − ROE ngành)  hoặc  VCSH × (ROE bq 3 năm − lãi TPCP 5 năm)</code><p>VD: 289.000 × (11,4% − 9%) = 6.936.</p></div><div class=fc><h4>EPS</h4><code>EPS = (EAT − cổ tức ưu đãi − quỹ phúc lợi) ÷ Nbq; Nbq = Σ(Ni×Ti)/365</code><p>Cổ phiếu thưởng/cổ tức: hồi tố đầu năm; phát hành thêm: tính theo thời gian.</p></div><div class=fc><h4>P/E định giá</h4><code>P = EPS × P/E*; Industry P/E = ΣVốn hóa ÷ ΣEAT; P/E = 1 ÷ yield</code><p>P/E* = ngành / nội tại / lịch sử / 1÷yield (chọn 1).</p></div><div class=fc><h4>Intrinsic P/E</h4><code>P/E = (1 − b)(1 + g)/(r − g);  g = b × ROE;  b = 1 − payout</code><p>b = retention.</p></div><div class=fc><h4>CAPM</h4><code>Rj = Rf + β(Rm − Rf);  β = Cov(Ra,Rm)/Var(Rm)</code><p></p></div><div class=fc><h4>Gordon</h4><code>P0 = D0(1+g)/(r−g) = D1/(r−g);  r = [D0(1+g) + P0·g]/P0;  cổ tức đều: V = D/ke</code><p>Preferred: P0 = Dp/r</p></div><div class=fc><h4>WACC</h4><code>WACC = E/V·ke + D/V·kd·(1 − t)</code><p>Photon: 5,45%.</p></div><div class=fc><h4>DDM nhiều giai đoạn</h4><code>V = V1 (g cao) + V2 (g giảm dần) + V3 = D_N(1+gs)/(ke−gs) ÷ (1+ke)^N</code><p>PV của giá trị cuối kỳ!</p></div><div class=fc><h4>FCFE / FCFF</h4><code>FCFE = NI + D&amp;A − Capex − ΔWC + Net borrowing<br>FCFF = FCFE − Net borrowing + Interest(1−t)</code><p>Giá/cp: FCFE: V÷N; FCFF: (V − Debt)÷N.</p></div><div class=fc><h4>Tỷ số</h4><code>Current = CA/CL; Quick = (CA − Inventory)/CL; D/E; Debt ratio = Debt/TA; Interest coverage = EBIT/Interest; ROA = NI/TA; ROE = NI/Equity</code><p></p></div></div>"}, "3": {"nho": "<div class=fcs><div class=flip tabindex=0><div class=ff><div class=front><span class=hint>tap ↻</span><b>Bond</b></div><div class=back><div>Công cụ thu nhập cố định; người mua = <b>creditor</b>; kỳ hạn &amp; lãi suất cố định (trừ perpetual); chuyển nhượng tự do</div><p class=mt>💡 Bond = chủ nợ</p></div></div></div><div class=flip tabindex=0><div class=ff><div
