<div class=ff><div class=front><span class=hint>tap ↻</span><b>Technical</b></div><div class=back><div><b>Price + volume</b>; trả lời <b>how</b>; tăng/giảm; <b>ngắn hạn</b></div><p class=mt>💡 T = How = ngắn hạn</p></div></div></div><div class=flip tabindex=0><div class=ff><div class=front><span class=hint>tap ↻</span><b>Quantitative</b></div><div class=back><div>Mô hình toán dự báo vĩ mô, doanh thu, lợi nhuận, giá</div></div></div></div><div class=flip tabindex=0><div class=ff><div class=front><span class=hint>tap ↻</span><b>Value investing</b></div><div class=back><div>Mua khi giá &lt; intrinsic/book value; không theo đám đông; dài hạn</div><p class=mt>💡 Value = undervalued</p></div></div></div><div class=flip tabindex=0><div class=ff><div class=front><span class=hint>tap ↻</span><b>Growth investing</b></div><div class=back><div>EPS tăng cao hơn ngành/thị trường; 5 năm gấp đôi tài sản → CANSLIM</div></div></div></div><div class=flip tabindex=0><div class=ff><div class=front><span class=hint>tap ↻</span><b>GARP</b></div><div class=back><div>Growth + Value, P/E tương đối thấp, <b>PEG &lt; 1</b> (slide gõ nhầm 'GRAP')</div><p class=mt>💡 Bẫy chính tả</p></div></div></div><div class=flip tabindex=0><div class=ff><div class=front><span class=hint>tap ↻</span><b>Dogs of the Dow</b></div><div class=back><div><b>10</b> cổ phiếu cổ tức cao nhất trong <b>30</b> DJIA; tái cân bằng <b>đầu năm</b></div><p class=mt>💡 10/30, đầu năm, yield</p></div></div></div><div class=flip tabindex=0><div class=ff><div class=front><span class=hint>tap ↻</span><b>CANSLIM (O'Neil, IBD)</b></div><div class=back><div><b>C</b>urrent quarterly EPS &gt;20% (ROE≥17%) • <b>A</b>nnual EPS 3–5 năm &gt;20% • <b>N</b>ew product/mgmt/high • <b>S</b>upply &amp; demand (buyback = giảm cung) • <b>L</b>eader (laggard bán đầu tiên) • <b>I</b>nstitutional (vừa phải, đừng over-owned) • <b>M</b>arket direction</div><p class=mt>💡 'Cảnh Anh Nay Sợ Lạnh Im Mồm'</p></div></div></div><div class=flip tabindex=0><div class=ff><div class=front><span class=hint>tap ↻</span><b>Điểm môn</b></div><div class=back><div>Chuyên cần 10% • Thuyết trình 20% • Giữa kỳ (tự luận 3 câu) 20% • <b>Cuối kỳ 40 trắc nghiệm 50%</b></div><p class=mt>💡 10–20–20–50</p></div></div></div></div><div class=tip>💡 Kỳ thi: nhiều câu 'đâu KHÔNG phải' – học thuộc <b>danh sách đầy đủ</b> (8 bước, 6 sai lầm, 7 chữ CANSLIM, 9 chiến lược).</div>", "ct": "<div class=fl><div class=fc><h4>P/E</h4><code>P/E = P ÷ EPS</code><p>Bao nhiêu năm EPS để bằng giá. Ví dụ 60.000/5.000 = 12.</p></div><div class=fc><h4>P/B</h4><code>P/B = P ÷ BVPS</code><p>&lt;1: giá dưới sổ sách (có thể rẻ).</p></div><div class=fc><h4>P/S</h4><code>P/S = P ÷ Sales per share = Vốn hóa ÷ Doanh thu</code><p></p></div><div class=fc><h4>PEG</h4><code>PEG = (P/E) ÷ tốc độ tăng EPS (%)</code><p>=1 hợp lý; &gt;1 đắt; &lt;1 rẻ.</p></div><div class=fc><h4>DPS / payout / yield</h4><code>DPS = Cổ tức ÷ số cp; Payout = DPS ÷ EPS; Yield = DPS ÷ P; b = 1 − payout</code><p>Retention b + payout = 1.</p></div></div>"}, "2": {"nho": "<div class=fcs><div class=flip tabindex=0><div class=ff><div class=front><span class=hint>tap ↻</span><b>Top-down</b></div><div class=back><div>Economy → Industry → Firm; <b>tổ chức</b>; kinh tế/ngành bất ổn thì không đầu tư</div><p class=mt>💡 Top = trên cùng</p></div></div></div><div class=flip tabindex=0><div class=ff><div class=front><span class=hint>tap ↻</span><b>Bottom-up</b></div><div class=back><div>Tìm cổ phiếu <b>undervalued</b> từ doanh nghiệp; <b>cá nhân</b></div></div></div></div><div class=flip tabindex=0><div class=ff><div class=front><span class=hint>tap ↻</span><b>Chu kỳ kinh tế</b></div><div class=back><div>Expansion (lãi suất thấp, lợi nhuận↑) → Peak (tăng trưởng cực đại, chi phí↑) → Recession (GDP↓, chạy sang trái phiếu/tiền mặt, Fed hạ lãi) → pha 4 (slide gọi 'Depression' nhưng nội dung = <b>đáy &amp; phục hồi</b>)</div><p class=mt>💡 Bẫy tên vs nội dung</p></div></div></div><div class=flip tabindex=0><div class=ff><div class=front><span class=hint>tap ↻</span><b>Chọn ngành</b></div><div class=back><div>Tăng trưởng ngành &gt; GDP (≥5 năm) + hợp giai đoạn nền kinh tế</div></div></div></div><div class=flip tabindex=0><div class=ff><div class=front><span class=hint>tap ↻</span><b>Phân loại ngành</b></div><div class=back><div>ISIC (UN) • NAICS (USA) • UK SIC • ICB (Dow Jones &amp; FTSE) • GICS (Morgan Stanley &amp; S&amp;P) • VSIC 2007 (VN)</div><p class=mt>💡 I-N-U-I-G-V</p></div></div></div><div class=flip tabindex=0><div class=ff><div class=front><span class=hint>tap ↻</span><b>Porter 5 forces</b></div><div class=back><div>New entrants • Buyers • Suppliers • Substitutes • Rivalry (Michael Porter, 1947, Harvard)</div><p class=mt>💡 Mới–Khách–Nhà cung–Thay thế–Thù địch</p></div></div></div><div class=flip tabindex=0><div class=ff><div class=front><span class=hint>tap ↻</span><b>Buyers mạnh khi</b></div><div class=back><div>Tập trung, mua nhiều, sản phẩm đồng nhất, <b>switch cost thấp</b>, am hiểu</div></div></div></div><div class=flip tabindex=0><div class=ff><div class=front><span class=hint>tap ↻</span><b>5 lợi thế cạnh tranh</b></div><div class=back><div>Trademark • License/patent • Fee (dominate market) • Convert fee (switching) • Price</div><p class=mt>💡 T-L-F-C-P</p></div></div></div><div class=flip tabindex=0><div class=ff><div class=front><span class=hint>tap ↻</span><b>Agency problem</b></div><div class=back><div>Nghiêm trọng khi cổ tức <b>thấp</b>, nợ <b>thấp</b>, Ban điều hành sở hữu <b>thấp</b> (Coteccons)</div><p class=mt>💡 3 chữ 'thấp'</p></div></div></div><div class=flip tabindex=0><div class=ff><div class=front><span class=hint>tap ↻</span><b>Buffett 4 nguyên tắc</b></div><div class=back><div>Quản lý trung thực/năng lực • Triển vọng dài hạn • Ổn định • Giá hợp lý</div><p class=mt>💡 Buffett: học trò Graham</p></div></div></div><div class=flip tabindex=0><div class=ff><div class=front><span class=hint>tap ↻</span><b>Graham / Fisher</b></div><div class=back><div>Graham: cha đẻ value investing, mua dưới intrinsic value. Fisher (1931): chất lượng quản lý, R&amp;D, lợi nhuận cao</div></div></div></div><div class=flip tabindex=0><div class=ff><div class=front><span class=hint>tap ↻</span><b>3 nhóm định giá</b></div><div class=back><div><b>Asset</b> • <b>Relative</b> (P/E, P/B, P/S, PEG) • <b>DCF</b> (DDM, FCFE, FCFF)</div><p class=mt>💡 A-R-D</p></div></div></div><div class=flip tabindex=0><div class=ff><div class=front><span class=hint>tap ↻</span><b>Lưu ý định giá</b></div><div class=back><div>Chủ quan; thay đổi theo thời gian; không bao giờ chắc 100%; mô hình phức tạp ≠ đúng hơn; <b>quá trình quan trọng hơn kết quả</b></div><p class=mt>💡 Subjective / process</p></div></div></div><div class=flip tabindex=0><div class=ff><div class=front><span class=hint>tap ↻</span><b>Asset valuation</b></div><div class=back><div>Dùng trong cổ phần hóa; hạn chế: chỉ nhìn quá khứ/hiện tại, không xét tương lai và tương tác DN</div></div></div></div><div class=flip tabindex=0><div class=ff><div class=front><span class=hint>tap ↻</span><b>Chọn r (discount rate)</b></div><div class=back><div>CAPM • Gordon (IRR) • WACC • kỳ vọng từng nhà đầu tư (Buffett: max(lạm phát, lãi suất, Rf) + premium)</div></div></div></div><div class=flip tabindex=0><div class=ff><div class=front><span class=hint>tap ↻</span><b>DDM phù hợp</b></div><div class=back><div>Tăng trưởng ổn định; chia phần lớn lợi nhuận; g &lt; r</div></div></div></div><div class=flip tabindex=0><div class=ff><div class=front><span class=hint>tap ↻</span><b>FCFE vs FCFF</b></div><div class=back><div>FCFE → ke → giá trị vốn chủ. FCFF → WACC → giá trị DN, trừ nợ rồi chia cp</div><p class=mt>💡 Buffett: 2 giai đoạn, GĐ1 = 10 năm</p></div></div></div></div>", "ct": "<div class=fl><div class=fc><h4>Asset valuation (đầu tư VN)</h4><code>Firm value = Total assets − Total liabilities + Business advantages + Adjusted RE<br>Giá/cp = Firm value ÷ số cp lưu hành</code><p>Lưu hành = phát hành − cổ phiếu quỹ; phát hành = vốn điều lệ ÷ mệnh giá.</p></div><div class=fc><h4>Business advantages</h4><code>BA = VCSH bq × (ROE firm − ROE ngành)  hoặc  VCSH × (ROE bq 3 năm − lãi TPCP 5 năm)</code><p>VD: 289.000 × (11,4% − 9%) = 6.936.</p></div><div class=fc><h4>EPS</h4><code>EPS = (EAT − cổ tức ưu đãi − quỹ phúc lợi) ÷ Nbq; Nbq = Σ(Ni×Ti)/365</code><p>Cổ phiếu thưởng/cổ tức: hồi tố đầu năm; phát hành thêm: tính theo thời gian.</p></div><div class=fc><h4>P/E định giá</h4><code>P = EPS × P/E*; Industry P/E = ΣVốn hóa ÷ ΣEAT; P/E = 1 ÷ yield</code><p>P/E* = ngành / nội tại / lịch sử / 1÷yield (chọn 1).</p></div><div class=fc><h4>Intrinsic P/E</h4><code>P/E = (1 − b)(1 + g)/(r − g);  g = b × ROE;  b = 1 − payout</code><p>b = retention.</p></div><div class=fc><h4>CAPM</h4><code>Rj = Rf + β(Rm − Rf);  β = Cov(Ra,Rm)/Var(Rm)</code><p></p></div><div class=fc><h4>Gordon</h4><code>P0 = D0(1+g)/(r−g) = D1/(r−g);  r = [D0(1+g) + P0·g]/P0;  cổ tức đều: V = D/ke</code><p>Preferred: P0 = Dp/r</p></div><div class=fc><h4>WACC</h4><code>WACC = E/V·ke + D/V·kd·(1 − t)</code><p>Photon: 5,45%.</p></div><div class=fc><h4>DDM nhiều giai đoạn</h4><code>V = V1 (g cao) + V2 (g giảm dần) + V3 = D_N(1+gs)/(ke−gs) ÷ (1+ke)^N</code><p>PV của giá trị cuối kỳ!</p></div><div class=fc><h4>FCFE / FCFF</h4><code>FCFE = NI + D&amp;A − Capex − ΔWC + Net borrowing<br>FCFF = FCFE − Net borrowing + Interest(1−t)</code><p>Giá/cp: FCFE: V÷N; FCFF: (V − Debt)÷N.</p></div><div class=fc><h4>Tỷ số</h4><code>Current = CA/CL; Quick = (CA − Inventory)/CL; D/E; Debt ratio = Debt/TA; Interest coverage = EBIT/Interest; ROA = NI/TA; ROE = NI/Equity</code><p></p></div></div>"}, "3": {"nho": "<div class=fcs><div class=flip tabindex=0><div class=ff><div class=front><span class=hint>tap ↻</span><b>Bond</b></div><div class=back><div>Công cụ thu nhập cố định; người mua = <b>creditor</b>; kỳ hạn &amp; lãi suất cố định (trừ perpetual); chuyển nhượng tự do</div><p class=mt>💡 Bond = chủ nợ</p></div></div></div><div class=flip tabindex=0><div class=ff><div class=front><span class=hint>tap ↻</span><b>Phân loại</b></div><div class=back><div>Issuer: government/civil/corporate • Kỳ hạn: short 1–5, intermediate 5–12, long &gt;12 • Coupon: floating/coupon/zero • Tính chất: redeemable/convertible/warrant-linked • Thị trường: domestic/foreign/Eurobond</div><p class=mt>💡 5–12</p></div></div></div><div class=flip tabindex=0><div class=ff><div class=front><span class=hint>tap ↻</span><b>Par value</b></div><div class=back><div>= face value = face amount = principal amount</div></div></div></div><div class=flip tabindex=0><div class=ff><div class=front><span class=hint>tap ↻</span><b>Cấu trúc kỳ hạn</b></div><div class=back><div>Một lần • Serial • Balloon (đợt cuối rất lớn) • Callable</div><p class=mt>💡 Balloon cuối phình</p></div></div></div><div class=flip tabindex=0><div class=ff><div class=front><span class=hint>tap ↻</span><b>Convertible</b></div><div class=back><div>Đổi thành cổ phiếu ở giá chuyển đổi. Conversion rate = Par ÷ conv. price. Conversion value = số cp × giá cp</div><p class=mt>💡 So 3 phương án: chuyển đổi / bán công ty / bán thị trường</p></div></div></div><div class=flip tabindex=0><div class=ff><div class=front><span class=hint>tap ↻</span><b>7 rủi ro</b></div><div class=back><div>Interest rate • Credit • Inflation • Liquidity • Exchange rate • Reinvestment • Tax</div><p class=mt>💡 Lãi–Tín–Lạm–Thanh–Tỷ giá–Tái–Thuế</p></div></div></div><div class=flip tabindex=0><div class=ff><div class=front><span class=hint>tap ↻</span><b>Interest rate risk</b></div><div class=back><div>Lãi↑ ⇒ giá↓. Kỳ hạn <b>dài</b>, coupon <b>thấp</b> ⇒ nhạy hơn. Chủ yếu trái phiếu lãi cố định</div><p class=mt>💡 Bập bênh</p></div></div></div><div class=flip tabindex=0><div class=ff><div class=front><span class=hint>tap ↻</span><b>Credit risk</b></div><div class=back><div>Moody's, S&amp;P, Fitch. Aaa/AAA cao nhất; <b>junk từ Ba1/BB+</b>; Baa3/BBB− còn investment grade</div></div></div></div><div class=flip tabindex=0><div class=ff><div clas const KMAP=new Map();KW.forEach(k=>{const key=k[2]?k[0]:k[0].toLowerCase();if(!KMAP.has(key))KMAP.set(key,k)});
const esc=s=>s.replace(/[.*+?^${}()|[\]\\\/]/g,"\\$&");
const KRE=new RegExp("(^|[^A-Za-z0-9_])("+[...KW].sort((a,b)=>b[0].length-a[0].length).map(k=>esc(k[0])).join("|")+")(?![A-Za-z0-9_])","gi");
function hl(html,found){let inCode=0;
 return html.split(/(<[^>]+>)/).map(seg=>{
  if(seg[0]=="<"){if(/^<code/i.test(seg))inCode=1;else if(/^<\/code/i.test(seg))inCode=0;if(/^<mark/i.test(seg))inCode=2;if(/^<\/mark/i.test(seg))inCode=0;return seg}
  if(inCode)return seg;
  return seg.replace(KRE,(m,p,k)=>{let e=KMAP.get(k.toLowerCase())||KMAP.get(k);
   if(!e||(e[2]&&e[0]!==k))return m;if(found)found.set(e[0],e[1]);
   return p+`<mark class="k${e[1]}">${k}</mark>`})}).join("")}
const md=s=>s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/\*\*(.+?)\*\*/g,"<b>$1</b>");
const H=(s,f)=>hl(md(s),f);
const store={get(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
Q.forEach((q,i)=>q.id=i);
let tab="ch1",sub="nho",qs={mode:"drill"};
const tabs=[["ch1","Ch.1"],["ch2","Ch.2"],["ch3","Ch.3"],["ch4","Ch.4"],["ch5","Ch.5"],["dang","Dạng bài"],["quiz","Quiz"]];
function nav(){$("#nav").innerHTML=tabs.map(t=>`<button style="--cc:var(--c${CCOL[t[0]]||(t[0]=="quiz"?5:2)})" class="${t[0]==tab?"on":""}" data-t="${t[0]}">${t[1]}</button>`).join("");
 $("#nav").querySelectorAll("button").forEach(b=>b.onclick=()=>{tab=b.dataset.t;render();scrollTo(0,0)})}
function legend(){return `<div class="legend"><mark class="k1">Strategy / People</mark><mark class="k2">Valuation</mark><mark class="k3">Bonds</mark><mark class="k4">Derivatives / Funds</mark><mark class="k5">Warning word</mark><mark class="k6">Cycle / TA</mark></div>`}
function render(){nav();const m=$("#m");m.style.setProperty("--cc",`var(--c${CCOL[tab]||(tab=="quiz"?5:2)})`);
 if(tab[0]=="c"){const n=tab.slice(2);
  m.innerHTML=`<div class="sub"><button data-s="nho" class="${sub=="nho"?"on":""}">🧠 Cần nhớ (thẻ lật)</button><button data-s="ct" class="${sub=="ct"?"on":""}">∑ Công thức</button>${sub=="nho"?`<button id="flipall">↻ Lật tất cả</button>`:""}</div><h2>${CH[n]}</h2>${legend()}`+hl(NOTES[n][sub]);
  m.querySelectorAll("[data-s]").forEach(b=>b.onclick=()=>{sub=b.dataset.s;render()});
  const fa=$("#flipall");if(fa)fa.onclick=()=>{const all=[...m.querySelectorAll(".flip")];const open=all.some(x=>!x.classList.contains("open"));all.forEach(x=>x.classList.toggle("open",open))};
  m.querySelectorAll(".flip").forEach(f=>{f.onclick=()=>f.classList.toggle("open");f.onkeydown=e=>{if(e.key=="Enter"||e.key==" "){e.preventDefault();f.classList.toggle("open")}}})}
 else if(tab=="dang"){m.innerHTML=`<h2>Dạng bài &amp; cách giải</h2>${legend()}<div class="tip">Mọi số đã được kiểm chứng bằng Python. Nếu slide làm tròn khác (vd 49.098 vs 49.099) → chọn đáp án gần nhất.</div>`+hl(DANG)}
 else quiz(m)}
function quiz(m){
 const wrong=store.get("wrong",[]);
 m.innerHTML=`<h2>Quiz (English)</h2>${legend()}<div class="bar"><button data-m="drill" class="${qs.mode=="drill"?"on":""}">Luyện từng câu</button><button data-m="exam40" class="${qs.mode=="exam40"?"on":""}">Đề 40 câu · 40 phút</button><button data-m="exam120" class="${qs.mode=="exam120"?"on":""}">Đề 120 câu · 120 phút</button><button data-m="wrong" class="${qs.mode=="wrong"?"on":""}">Ôn câu sai (${wrong.length})</button></div><div id="qa"></div>`;
 m.querySelectorAll("[data-m]").forEach(b=>b.onclick=()=>{qs={mode:b.dataset.m};quiz(m)});
 if(qs.mode=="drill")setup(false);else if(qs.mode=="wrong")setup(true);else exam(qs.mode=="exam120"?120:40);
}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a}
function setup(w){const tags=[...new Set(Q.map(q=>q.tag))];
 $("#qa").innerHTML=`<div class="bar">Chapter <select id="fc"><option value="">All</option>${[1,2,3,4,5].map(i=>`<option value="${i}">${CH[i]}</option>`).join("")}</select> Type <select id="ft"><option value="">All</option>${tags.map(t=>`<option>${t}</option>`).join("")}</select> <label><input type="checkbox" id="sh" checked> Shuffle</label> <button id="go" class="on">Bắt đầu ▶</button></div><div id="qq"></div>`;
 $("#go").onclick=()=>{let l=Q.filter(q=>(!$("#fc").value||q.ch==$("#fc").value)&&(!$("#ft").value||q.tag==$("#ft").value));
  if(w){const ws=store.get("wrong",[]);l=l.filter(q=>ws.includes(q.id))}
  if($("#sh").checked)l=shuffle(l);
  if(!l.length){$("#qq").innerHTML="<p>Không có câu nào.</p>";return}
  l.length>20?paged(l,{instant:true,label:"Practice"}):drill(l,0,0)}}
function head(q,i,n){return `<div class="mut"><span class="chp" style="--cc:var(--c${q.ch})">${CH[q.ch]}</span><span class="tag">${q.tag}</span> · Question ${i+1}/${n}</div>`}
function qHTML(q,i,n,locked,pick,order){
 return `<div class="qb" style="--cc:var(--c${q.ch})">${head(q,i,n)}<div class="qt">${H(q.q)}</div>`+
 order.map((oi,k)=>{let c="opt";if(locked){if(oi==0)c+=" ok";else if(pick==oi)c+=" no"}else if(pick==oi)c+=" sel";
  return `<button class="${c}" data-o="${oi}"><i>${"ABCD"[k]}</i><span>${H(q.o[oi])}</span></button>`}).join("")+`</div>`}
function fbox(q,ok,order){const f=new Map();
 const ex=H(q.e,f),tip=H(q.t,f);md(q.q);H(q.q,f);H(q.o[0],f);
 const chips=[...f].map(([k,g])=>`<mark class="k${g}">${k}</mark>`).join("");
 return `<div class="fb"><div class="res" style="color:${ok?"var(--ok)":"var(--bad)"}">${ok?"✅ Correct":"❌ Wrong"} — answer: ${"ABCD"[order.indexOf(0)]}</div><div>${ex}</div>`+
 (chips?`<div class="box"><h5>🔑 Keyword</h5><div class="chips">${chips}</div></div>`:"")+`<div class="box"><h5>💡 Mẹo</h5>${tip}</div></div>`}
function drill(l,i,score){const q=l[i],order=shuffle([0,1,2,3]);let locked=false;
 const draw=(pick)=>{$("#qq").innerHTML=`<div class="bar"><div class="prog"><div style="width:${(i+(locked?1:0))/l.length*100}%"></div></div><span class="mut"><b>${score}</b>/${i+(locked?1:0)} correct</span></div>`+qHTML(q,i,l.length,locked,pick,order)+(locked?fbox(q,pick==0,order)+`<div class="bar"><button id="nx" class="on">${i+1<l.length?"Next question →":"See result"}</button></div>`:"");
  if(!locked)$("#qq").querySelectorAll(".opt").forEach(b=>b.onclick=()=>{locked=true;const p=+b.dataset.o;if(p==0)score++;rec(q.id,p==0);draw(p);$("#qq").querySelector(".fb").scrollIntoView({block:"nearest",behavior:"smooth"})});
  else $("#nx").onclick=()=>{i+1<l.length?(drill(l,i+1,score),scrollTo(0,0)):$("#qq").innerHTML=`<div class="qb"><div class="big">${score}/${l.length}</div><p>Câu sai được lưu ở “Ôn câu sai”.</p></div>`}};
 draw(null)}
function rec(id,ok){let w=store.get("wrong",[]);w=ok?w.filter(x=>x!=id):[...new Set([...w,id])];store.set("wrong",w)}
function exam(N){const quota=N==120?{1:18,2:36,3:36,4:24,5:6}:{1:6,2:12,3:12,4:8,5:2};let l=[];
 for(const c in quota)l=l.concat(shuffle(Q.filter(q=>q.ch==c)).slice(0,quota[c]));
 paged(shuffle(l),{minutes:N==120?120:40,label:N+"-question exam"})}
const PS=10;
function paged(l,opt){const N=l.length,np=Math.ceil(N/PS),ans={},ord=l.map(()=>shuffle([0,1,2,3])),inst=!!opt.instant;
 let pg=0,done=false,tm,end=opt.minutes?Date.now()+opt.minutes*60000:0,sc=0;
 const locked=k=>done||(inst&&ans[k]!==undefined);
 const pager=id=>{let h=`<div class="bar pgr"><button data-g="prev"${pg==0?" disabled":""}>← Prev</button><span class="mut">Page <b>${pg+1}</b>/${np}</span><button data-g="next"${pg==np-1?" disabled":""}>Next →</button><label class="mut">Go to <input type="number" min="1" max="${np}" value="${pg+1}" class="jmp" data-j></label></div>`;
  if(id=="t")h+=`<div class="bar">${Array.from({length:np},(_,p)=>{let c=0;for(let k=p*PS;k<Math.min(N,p*PS+PS);k++)if(ans[k]!==undefined)c++;const full=c==Math.min(PS,N-p*PS);return `<button data-p="${p}" class="num ${p==pg?"on":""} ${full&&p!=pg?"done":""}">${p+1}</button>`}).join("")}</div>`;
  return h};
 const draw=(keep)=>{const y=scrollY,na=Object.keys(ans).length;let h="";
  if(done)h+=`<div class="qb"><div class="big">${sc}/${N} (${(sc/N*10).toFixed(2)}/10)</div><p>${opt.label}: review below. Wrong answers are saved in “Ôn câu sai”.</p></div>`;
  else h+=`<div class="bar stick">${opt.minutes?`<span class="big" id="clk"></span>`:""}<div class="prog"><div style="width:${na/N*100}%"></div></div><span class="mut"><b>${na}</b>/${N} answered</span><button id="sub" class="on">${opt.minutes?"Nộp bài":"Kết thúc"}</button></div>`;
  h+=pager("t");
  for(let k=pg*PS;k<Math.min(N,pg*PS+PS);k++){const q=l[k],lk=locked(k);h+=qHTML(q,k,N,lk,ans[k],ord[k])+(lk?fbox(q,ans[k]===0,ord[k]):"")}
  h+=pager("b");$("#qa").innerHTML=h;
  $("#qa").querySelectorAll(".qb").forEach((bx,i)=>{const k=pg*PS+i;bx.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{if(locked(k))return;ans[k]=+b.dataset.o;if(inst)rec(l[k].id,ans[k]===0);draw(1)})});
  $("#qa").querySelectorAll("[data-g]").forEach(b=>b.onclick=()=>{pg=Math.max(0,Math.min(np-1,pg+(b.dataset.g=="next"?1:-1)));draw();scrollTo(0,0)});
  $("#qa").querySelectorAll("[data-p]").forEach(b=>b.onclick=()=>{pg=+b.dataset.p;draw();scrollTo(0,0)});
  $("#qa").querySelectorAll("[data-j]").forEach(e=>e.onchange=()=>{pg=Math.max(0,Math.min(np-1,(+e.value||1)-1));draw();scrollTo(0,0)});
  const sb=$("#sub");if(sb)sb.onclick=()=>{const un=N-Object.keys(ans).length;if(!un||confirm(`${un} unanswered. Submit anyway?`))finish()};
  if(keep)scrollTo(0,y);tick()};
 const tick=()=>{clearInterval(tm);if(!opt.minutes||done)return;const f=()=>{const s=Math.max(0,(end-Date.now())/1000|0),e=$("#clk");if(e)e.textContent=`⏱ ${String(s/60|0).padStart(2,"0")}:${String(s%60).padStart(2,"0")}`;if(s<=0&&!done){clearInterval(tm);finish()}if(!e)clearInterval(tm)};f();tm=setInterval(f,1000)};
 const finish=()=>{if(done)return;done=true;clearInterval(tm);sc=0;l.forEach((q,k)=>{const ok=ans[k]===0;if(ok)sc++;if(!inst)rec(q.id,ok)});pg=0;draw();scrollTo(0,0)};
 draw()}
function setTheme(d){const r=document.documentElement;r.dataset.t=d?"dark":"light";if(d)document.body.setAttribute("data-dark","");else document.body.removeAttribute("data-dark")}
$("#th").onclick=()=>{const r=document.documentElement;const d=r.dataset.t=="dark"||(!r.dataset.t&&matchMedia("(prefers-color-scheme:dark)").matches);setTheme(!d)};
if(matchMedia("(prefers-color-scheme:dark)").matches)document.body.setAttribute("data-dark","");
render();
